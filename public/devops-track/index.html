<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bashbop DevOps Track</title>
<meta name="description" content="An in-depth, progress-tracked DevOps track across bashbop and Brain Boost Buddy: eleven jobs and a capstone, plus a job-ready track with production Kubernetes, Ansible and Jenkins, certification and interviews.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚦</text></svg>">
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style id="app-css">
:root{
  --ground:#F2F4F7;--surface:#FFFFFF;--sunk:#E9EDF3;--ink:#142033;--ink-2:#4A5669;--ink-3:#7A8699;--line:#D5DBE4;
  --accent:#2A4FD6;--accent-ink:#FFFFFF;--accent-soft:#E3E9FB;
  --pass:#1F8A4C;--pass-soft:#DDF1E5;--run:#B86E00;--run-soft:#FBEBD2;--fail:#C9362B;--fail-soft:#F8E0DD;--queued:#9AA5B5;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E141D;--surface:#161E2A;--sunk:#1C2533;--ink:#E6EBF2;--ink-2:#A3AEBF;--ink-3:#6F7B8E;--line:#283345;
  --accent:#86A2FF;--accent-ink:#0E141D;--accent-soft:#1D2848;
  --pass:#4CC784;--pass-soft:#16301F;--run:#F0A93B;--run-soft:#33260F;--fail:#F0685C;--fail-soft:#3A1B18;--queued:#5C687A;color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#0E141D;--surface:#161E2A;--sunk:#1C2533;--ink:#E6EBF2;--ink-2:#A3AEBF;--ink-3:#6F7B8E;--line:#283345;
  --accent:#86A2FF;--accent-ink:#0E141D;--accent-soft:#1D2848;
  --pass:#4CC784;--pass-soft:#16301F;--run:#F0A93B;--run-soft:#33260F;--fail:#F0685C;--fail-soft:#3A1B18;--queued:#5C687A;color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font:0.86em/1.4 var(--mono);background:var(--sunk);border:1px solid var(--line);padding:.05em .38em;border-radius:4px;word-break:break-word}
.app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh}

/* top bar */
.top{display:flex;align-items:center;gap:20px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font:800 15px/1 var(--display);font-stretch:112%;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.rail{flex:1;display:flex;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.job{display:flex;align-items:center;gap:7px;border:0;background:none;padding:4px 6px;cursor:pointer;white-space:nowrap;border-radius:6px;font:500 12px/1 var(--mono);color:var(--ink-2)}
.job:hover{background:var(--sunk)}
.job.here{color:var(--ink);background:var(--accent-soft)}
.wire{flex:1;min-width:10px;height:2px;background:var(--line);position:relative;overflow:hidden}
.wire.lit{background:var(--pass)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--queued);display:grid;place-items:center;flex:none}
.dot.passed{background:var(--pass);border-color:var(--pass)}
.dot.passed::after{content:"";width:5px;height:3px;border:solid var(--surface);border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.dot.running{border-color:var(--run);position:relative}
.dot.running::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--run);animation:pulse 1.6s ease-in-out infinite}
.chip{font:500 12px/1 var(--mono);padding:7px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;display:flex;align-items:center;gap:7px;background:var(--surface)}
.chip b{width:7px;height:7px;border-radius:50%;background:var(--queued)}
.chip[data-s="saved"] b{background:var(--pass)}
.chip[data-s="unsaved"] b,.chip[data-s="saving"] b{background:var(--run)}
.chip[data-s="error"] b,.chip[data-s="conflict"] b{background:var(--fail)}
.chip button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 9px;font:600 11px/1 var(--mono);cursor:pointer}

/* stage */
.stage{overflow:hidden;position:relative}
.slide{position:absolute;inset:0;overflow-y:auto;padding:clamp(24px,5vh,56px) clamp(18px,5vw,64px) 40px}
.inner{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.slide.in-next{animation:inR .42s cubic-bezier(.2,.7,.2,1) both}
.slide.in-prev{animation:inL .42s cubic-bezier(.2,.7,.2,1) both}
.slide.animate [data-a]{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 55ms + 120ms)}
@keyframes inR{from{transform:translateX(40px);opacity:.0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-40px);opacity:.0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(.55);opacity:.5}}
@keyframes flow{to{background-position:-24px 0}}

.eyebrow{font:500 12px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.eyebrow .st{letter-spacing:.04em}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(40px,7vw,84px);line-height:.95;font-weight:850;font-stretch:118%;letter-spacing:-.035em}
h2{font-size:clamp(30px,4.6vw,54px);line-height:1;font-weight:800;font-stretch:114%;letter-spacing:-.03em}
h3{font-size:19px;line-height:1.2;font-weight:700;font-stretch:108%;letter-spacing:-.01em}
.lede{font-size:clamp(17px,1.6vw,20px);color:var(--ink-2);max-width:62ch;margin:0}
p{margin:0;max-width:68ch}
.muted{color:var(--ink-2)}
.small{font-size:14px}

.pill{font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:5px;white-space:nowrap}
.pill.passed{background:var(--pass-soft);color:var(--pass)}
.pill.running{background:var(--run-soft);color:var(--run)}
.pill.queued{background:var(--sunk);color:var(--ink-2)}
.pill.risk{background:var(--fail-soft);color:var(--fail)}
.pill.warn{background:var(--run-soft);color:var(--run)}
.pill.good{background:var(--pass-soft);color:var(--pass)}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}

/* cover run graph */
.run{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.runrow{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.runrow:first-child{border-top:0}
.runsep{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:12px 16px 8px;border-top:1px solid var(--line);background:var(--accent-soft)}
.runrow:hover{background:var(--sunk)}
.runrow .nm{font-weight:600}
.runrow .meta{font:12px/1.3 var(--mono);color:var(--ink-3)}
.bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--pass);border-radius:2px;transition:width .4s}
.runrow .right{display:flex;align-items:center;gap:10px;font:12px var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:28px;align-items:end}
.stat .n{font:800 44px/1 var(--display);font-stretch:112%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{font:12px/1.3 var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:12px var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* loop */
.loop{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.loop>div{padding:20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.loop>div:first-child{border-left:0}
.loop .k{font:600 12px var(--mono);color:var(--accent)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;font-size:14px}
kbd{font:600 12px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 7px;background:var(--surface);white-space:nowrap}

/* audit */
.findings{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.finding{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:start;padding:13px 16px;border-top:1px solid var(--line)}
.finding:first-child{border-top:0}
.finding .fix{font:12px var(--mono);color:var(--ink-3);white-space:nowrap;border:0;background:none;cursor:pointer;padding:0}
.finding .fix:hover{color:var(--accent)}
.strengths{display:flex;flex-wrap:wrap;gap:8px}
.strengths span{font-size:14px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--surface)}

/* concepts */
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.term b{font:600 14px/1.3 var(--mono);color:var(--ink)}
.term span{font-size:14px;color:var(--ink-2)}

/* flow diagram */
.flow{display:flex;align-items:stretch;overflow-x:auto;padding:6px 2px 14px}
.node{flex:1 1 0;min-width:112px;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative}
.node .tag{font:600 11px var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.node .t{font:700 16px/1.2 var(--display);font-stretch:106%}
.node .s{font-size:13px;color:var(--ink-2)}
.node.gap{border-style:dashed;border-color:var(--run)}
.node.gap .tag{color:var(--run)}
.node.hot{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.link{flex:0 0 34px;align-self:center;height:2px;background-image:linear-gradient(90deg,var(--accent) 50%,transparent 50%);background-size:12px 2px;animation:flow 1s linear infinite;position:relative}
.link::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--accent);border-right:0}
.callouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.callout{border-left:3px solid var(--run);padding:4px 0 4px 14px;font-size:15px;color:var(--ink-2)}
.callout.info{border-left-color:var(--accent)}

/* lab */
.labhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px}
.count{font:800 34px/1 var(--display);font-stretch:110%;font-variant-numeric:tabular-nums}
.count small{font:500 13px var(--mono);color:var(--ink-3);margin-left:6px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.task{border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task label{display:grid;grid-template-columns:22px 1fr;gap:14px;padding:13px 16px;cursor:pointer;align-items:start}
.task label:hover{background:var(--sunk)}
.task input{appearance:none;width:20px;height:20px;margin:2px 0 0;border:2px solid var(--queued);border-radius:5px;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.task input:checked{background:var(--pass);border-color:var(--pass)}
.task input:checked::after{content:"";width:9px;height:5px;border:solid var(--surface);border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.task input:checked:not(.settled)::after{animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(-1px) rotate(-45deg) scale(.2)}}
.task .tx{display:flex;flex-direction:column;gap:3px}
.task .why{font-size:13.5px;color:var(--ink-3)}
.task.done .main{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line);text-decoration-thickness:2px}

/* check */
details.q{border-top:1px solid var(--line);padding:12px 0}
details.q:first-of-type{border-top:0;padding-top:0}
details.q summary{cursor:pointer;font-weight:600;list-style:none;display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px}
details.q summary::before{content:"+";font:600 16px/1.4 var(--mono);color:var(--accent)}
details.q[open] summary::before{content:"−"}
details.q summary::-webkit-details-marker{display:none}
details.q p{margin:8px 0 0 28px;color:var(--ink-2);font-size:15px}
textarea{width:100%;min-height:120px;resize:vertical;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;font:14px/1.5 var(--mono)}
.res{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.res li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.res li::before{content:"↗";color:var(--accent);font-family:var(--mono)}

/* architecture */
.arch{margin:0;display:flex;flex-direction:column;gap:12px}
.svgwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.arch svg{display:block;width:100%;min-width:760px;height:auto}
.arch figcaption{font-size:14.5px;color:var(--ink-2);max-width:86ch}
.arch .zone{fill:var(--sunk)}
.arch .zl{font:600 11px var(--mono);letter-spacing:.06em;fill:var(--ink-3)}
.arch .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.arch .box.hot{stroke:var(--accent);stroke-width:2}
.arch .box.gap{stroke:var(--run);stroke-dasharray:5 4}
.arch .box.fail{stroke:var(--fail);stroke-width:2}
.arch .bt{font:700 13px var(--body);fill:var(--ink)}
.arch .bs{font:11px var(--mono);fill:var(--ink-2)}
.arch .ln{stroke:var(--ink-3);stroke-width:1.5;fill:none}
.arch .ln.gap{stroke:var(--run);stroke-dasharray:5 4}
.arch .ah{fill:var(--ink-3)}
.arch .al{font:11px var(--mono);fill:var(--ink-2);paint-order:stroke;stroke:var(--sunk);stroke-width:4px;stroke-linejoin:round}
.arch .al.gapt{fill:var(--run)}
.arch .al.w{stroke:var(--surface)}
.jobchips{display:flex;flex-wrap:wrap;gap:8px}
.jobchips button{font-size:14px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface);cursor:pointer;display:flex;gap:8px;align-items:center}
.jobchips button:hover{border-color:var(--accent)}
.jobchips b{font:600 11px var(--mono);color:var(--accent)}

/* deep dive */
.deep{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.deep{grid-template-columns:1fr}}
.codes{display:flex;flex-direction:column;gap:14px;min-width:0}
.codehead{font:12px var(--mono);color:var(--ink-3);margin-bottom:6px}
pre.code{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font:12.5px/1.6 var(--mono);color:var(--ink);tab-size:2}
pre.code code{background:none;border:0;padding:0;font:inherit;word-break:normal}
pre.code .c{color:var(--ink-3)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:15px;color:var(--ink-2)}
.steps li::before{counter-increment:s;content:counter(s);font:600 12px/22px var(--mono);width:22px;height:22px;text-align:center;border-radius:50%;background:var(--accent-soft);color:var(--accent)}
.steps li b{color:var(--ink);font-weight:600;display:block}

/* how it works */
.how{display:flex;flex-direction:column;gap:22px}
.how .explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px 24px}
.how .explain div{display:flex;flex-direction:column;gap:4px}
.how .explain b{font:700 15px/1.3 var(--display);font-stretch:106%}
.how .explain span{font-size:15px;color:var(--ink-2)}
.arch .lane{stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 4}
.arch .lh{fill:var(--surface);stroke:var(--ink-3);stroke-width:1.5}
.arch .note{fill:var(--accent-soft);stroke:none}
.arch .nt{font:11px var(--mono);fill:var(--ink)}
.arch .ln.hot{stroke:var(--accent);stroke-width:2}
.arch .ln.fail{stroke:var(--fail);stroke-width:2}
.arch .al.hott{fill:var(--accent)}
.arch .al.failt{fill:var(--fail)}
.arch .tbar{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.arch .tbar.gap{fill:var(--run-soft);stroke:var(--run)}
.arch .tbar.fail{fill:var(--fail-soft);stroke:var(--fail)}
.arch .tbar.pass{fill:var(--pass-soft);stroke:var(--pass)}
.arch .tick{stroke:var(--line);stroke-width:1}
.arch .mark{stroke:var(--fail);stroke-width:2;stroke-dasharray:4 3}
.arch .dotf{fill:var(--accent)}

/* drill */
.drill{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px;align-items:start}
.drill .panel h3{margin-bottom:10px;display:flex;gap:8px;align-items:center}
.drill .panel h3 .pill{font-size:10px}
.symptoms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:15px}
.symptoms li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;color:var(--ink-2)}
.symptoms li::before{content:"";width:8px;height:8px;margin-top:8px;border-radius:50%;background:var(--fail)}
details.hint{border-top:1px solid var(--line);padding:10px 0}
details.hint:first-of-type{border-top:0;padding-top:0}
details.hint summary{cursor:pointer;font:600 13px var(--mono);color:var(--accent);list-style:none}
details.hint summary::-webkit-details-marker{display:none}
details.hint[open] summary{margin-bottom:6px}
details.hint p{font-size:14.5px;color:var(--ink-2)}
details.reveal{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:14px 18px}
details.reveal[open]{border-style:solid}
details.reveal summary{cursor:pointer;font:700 15px var(--display);list-style:none;display:flex;justify-content:space-between;gap:10px}
details.reveal summary::after{content:"reveal";font:600 11px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
details.reveal[open] summary::after{content:"hide"}
details.reveal summary::-webkit-details-marker{display:none}
.reveal-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:14px}
.reveal-body h4{margin:0 0 6px;font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.reveal-body p{font-size:14.5px;color:var(--ink-2)}
.verify{font:12px/1.5 var(--mono);color:var(--ink-3);border-left:2px solid var(--pass);padding-left:10px}

@media (max-width:1300px){.job .jl{display:none}.job.here .jl{display:inline}}

/* bottom */
.bottom{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);background:var(--surface)}
.nav{display:flex;gap:8px}
.nav button{width:40px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font:600 16px var(--mono)}
.nav button:hover:not(:disabled){border-color:var(--ink-3)}
.nav button:disabled{opacity:.35;cursor:default}
.where{display:flex;flex-direction:column;gap:6px;min-width:0}
.where .lbl{font:12px/1 var(--mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden}
.track span{display:block;height:100%;background:var(--accent);transition:width .35s}
.ovbtn{font:500 12px var(--mono);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;cursor:pointer;white-space:nowrap}

/* overview */
.overview{position:fixed;inset:0;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(6px);overflow-y:auto;padding:40px clamp(16px,5vw,60px);z-index:10}
.ovgrid{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.ovgroup h3{margin-bottom:10px;display:flex;gap:10px;align-items:center}
.ovcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ovcard{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.ovcard:hover{border-color:var(--accent)}
.ovcard.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ovcard span{font:11px var(--mono);color:var(--ink-3)}

@media (max-width:760px){
  .top{flex-wrap:wrap;gap:10px}
  .rail{order:3;flex-basis:100%}
  .job .jl{display:none}
  .finding{grid-template-columns:1fr}
  .flow{flex-direction:column}
  .node{flex:0 0 auto}
  .link{flex:0 0 26px;width:2px;height:auto;align-self:center;background-image:linear-gradient(180deg,var(--accent) 50%,transparent 50%);background-size:2px 12px}
  .link::after{right:-4px;top:auto;bottom:-1px;border:5px solid transparent;border-top-color:var(--accent);border-bottom:0}
  .bottom{gap:10px;padding:10px 16px}
  .ovbtn{padding:9px 10px}
  .ovbtn kbd{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

  terms:[["Regions & AZs","Independent locations. Spread across two Availability Zones so one data-centre failure isn’t an outage."],["VPC & CIDR","Your private network, e.g. `10.0.0.0/16`, carved into subnets such as `10.0.1.0/24`."],["Public vs private subnets","Public routes `0.0.0.0/0` to an internet gateway; private sends it through a NAT gateway."],["Security groups","Stateful firewalls on each resource, allow the app’s group, never `0.0.0.0/0` to a database."],["IAM evaluation","An explicit deny beats any allow; anything not allowed is denied."],["Roles, not users","Workloads and CI assume short-lived roles. No access keys on laptops."],["Cost drivers","NAT data processing, egress, idle databases and forgotten load balancers, often more than compute."]],

{ id:"p11", short:"Security", title:"Security & supply chain: every hop from laptop to production", weeks:[25,27],
  why:"Both products handle money or licence keys, run third-party code in CI, and ship binaries to families’ computers. Security isn’t a final audit, it’s a control on every hop. In March 2025 the popular `tj-actions/changed-files` action had its version tags repointed to code that dumped CI secrets into logs; workflows pinned to a commit SHA were unaffected.",
  terms:[["Threat model","Who would attack this, what they want, and the cheapest path, written down per product."],["Least privilege","Every token, role and workflow job gets only the permissions its task needs."],["Secret lifecycle","Store, scope, rotate, revoke, and treat anything ever committed as compromised."],["Dependency risk","Lockfiles, `yarn npm audit`, Dependabot, and a look at every new package."],["Pinned actions","`uses: owner/action@<commit-sha>`, tags can move, SHAs can’t."],["SBOM & provenance","What’s inside a build, and a signed record of how and where it was built."],["OWASP Top 10","The 2025 risks that matter most for bashbop: broken access control (which now includes SSRF), software supply chain failures, injection and authentication failures."]],
  flowTitle:"Every hop is an attack path",
  flow:[["laptop","Developer","MFA, disk encryption"],["source","GitHub","rulesets, gitleaks"],["ci","Actions","pinned SHAs, OIDC, scoped tokens"],["build","Artifact","SBOM, provenance, signature"],["run","Production","secrets manager, minimal image"]],
  hot:2,
  callouts:[["warn","bashbop-event-web workflows use tags such as `actions/checkout@v6` and run `npx -y @nugehs/bouncer@latest`, a moved tag or a bad publish runs with that job’s permissions."],["info","Brain Boost Buddy already keeps the Lemon Squeezy API key in the Worker, never in the desktop app. That’s the pattern to repeat: secrets stay server-side."]],
  tasks:[
    ["Write a one-page threat model per product: assets (payments, licence keys, children’s progress data), likely attackers, and the top five risks.","Brain Boost Buddy is used by children, weigh its data accordingly."],
    ["Block secrets before they land: push protection on public repos (free), and gitleaks as a pre-commit hook and a required check everywhere else.","Secret scanning on the private BASHBOP repos needs the paid Secret Protection add-on, and private repos on a personal account can’t have it at all."],
    ["Pin every third-party action to a commit SHA with the version as a comment, and let Dependabot keep them updated.",""],
    ["Set `permissions: {}` at the top of every workflow and grant each job only what it uses.",""],
    ["Replace `@latest` installs in CI (for example `@nugehs/bouncer@latest`) with pinned versions.",""],
    ["Enable Dependabot alerts and security updates, and fail PRs that add a known-vulnerable dependency with `yarn npm audit` in CI.","`actions/dependency-review-action` does this more precisely, but needs the paid Code Security add-on on private repos."],
    ["Run `zizmor` on `.github/workflows` in every repo and fix the high-severity findings.","zizmor is a static analyser for GitHub Actions workflows."],
    ["Generate an SBOM and BuildKit provenance for the web image, sign it with cosign, and verify the signature before deploy.","`gh attestation` needs Enterprise Cloud for private repos; cosign works on any plan."],
    ["Rotate every secret that was ever committed, starting with the web `.env.test` `CSRF_SECRET`, and record rotation dates.",""],
    ["Test bashbop for broken access control on staging: with two accounts you own, can organiser A read or change organiser B’s events, guests or payouts by editing an id?",""],
    ["Review the licence Worker for abuse: rate limits, email enumeration through `/status`, and what an error response reveals.",""]
  ],
  exit:["No workflow can run a moved tag or hold an unscoped token.","Every secret has an owner, a location and a last-rotated date.","I’ve tested the top access-control risks on both products and fixed what I found."],
  quiz:[["A third-party action you use as `@v4` is compromised. What’s the blast radius, and what limits it?","It runs with that job’s `GITHUB_TOKEN` permissions and any secrets passed to the job. SHA pinning prevents the swap; scoped `permissions` and OIDC-only cloud access limit the damage."],
        ["You find a live API key in Git history. Order these: purge history, rotate the key, check usage logs.","Rotate first (it was compromised the moment it was pushed), then check the provider’s logs for misuse, then purge history as hygiene."],
        ["What’s the difference between an SBOM and provenance?","An SBOM lists the components inside an artifact; provenance attests which source commit and workflow built it. Together they answer ‘is this exactly what we built, from what?’"],
        ["An organiser edits `/events/123/guests` to `/events/124/guests` and sees another organiser’s guests. Which OWASP category, and where’s the fix?","Broken Access Control (A01). The fix is a server-side ownership check on every request, hiding the link in the UI changes nothing."],
        ["Why is `pull_request_target` combined with checking out the PR’s code dangerous?","It runs with the base repository’s secrets and a write-capable token while executing untrusted fork code, a direct path to stealing secrets."]],
  res:["OWASP, Top 10 and ASVS","GitHub Docs, Security hardening for GitHub Actions","OpenSSF Scorecard","zizmor, docs.zizmor.sh","SLSA, slsa.dev"]
},

{ id:"p12", short:"Capstone", title:"Capstone: a game day and a case study", weeks:[37,38],
  why:"Prove it end to end. Someone else breaks staging for both products without telling you what or when; you detect it from alerts, run the incident, recover and write it up. Then turn the whole track into a case study with real numbers, for a hiring manager, an investor or your own next decision.",
  terms:[["Game day","A planned, time-boxed exercise that injects real failures into a safe environment."],["Fault script","Scripted, reversible faults, so every break is repeatable and every undo is known."],["TTD / TTM","Time to detect and time to mitigate. Measure them from timestamps; don’t estimate."],["Incident roles","Commander decides and communicates; operators investigate. One person may hold two, on purpose."],["Blameless review","Asks how the system allowed the failure, not who caused it."],["Case study","Problem, constraints, decisions, results with numbers, and what you’d change."],["Evidence","PR links, dashboards and before/after metrics, claims a reader can check."]],
  flowTitle:"The game day",
  flow:[["prep","Facilitator","chooses three faults and times"],["inject","Faults go live","unannounced, staging only"],["detect","Alerts fire","time to detect starts here"],["respond","Run the incident","roles, runbooks, updates"],["learn","Review","postmortems, tracked fixes"]],
  hot:3,
  callouts:[["warn","Staging only, with a written undo for every fault and a hard stop time. A game day that damages production is an incident, not an exercise."],["info","If nobody else can facilitate, let a script pick the faults and times at random and write them to a log you don’t open until the end."]],
  tasks:[
    ["Write the game-day plan: date, time box, facilitator, abort criteria, and the undo for every fault.",""],
    ["Prepare at least three faults across both products, for example a wrong webhook secret on bashbop staging, a test feed whose `latest-mac.yml` names a missing file, and a staging Worker without its secret.",""],

  quiz:[["An alert fires 22 minutes after the fault and you mitigate 10 minutes later. Which do you improve first?","Detection, 22 of the 32 minutes of impact happened before anyone knew. Tighten the alert (burn-rate windows, a synthetic check) before speeding up the fix."],
        ["Mid-incident you find the root cause, but the proper fix needs a code change. What now?","Mitigate first: roll back, flip a flag or restore known-good config. The root-cause fix follows once users are no longer affected."],
        ["What makes a postmortem action item good?","Specific, owned, dated and preventive, ‘alert when webhook 4xx rate exceeds 5% for 10 minutes, owner: you, due 30 Sep’, never ‘be more careful’."],

{ id:"p13", part:"job", short:"K8s prod", title:"Production Kubernetes on a managed cluster", weeks:[39,43],
  why:"{job:p7} ran bashbop on a laptop cluster. Production-grade is what hiring managers actually probe: a managed cluster, ingress with TLS, autoscaling that doesn’t flap, pods that survive node drains and upgrades, per-pod cloud identity, secrets from a secrets manager, RBAC, in-cluster monitoring and GitOps you can roll back. Build it for bashbop staging, run it for a month, then tear it down; the bill is the reason not to keep it.",
  terms:[["Managed control plane","EKS runs the API server and etcd; you run the nodes and everything on them."],["Requests & limits","Requests drive scheduling and autoscaling; limits cap usage. Wrong requests break both."],["HPA","Scales replicas on CPU, memory or custom metrics, measured against requests."],["Karpenter / Cluster Autoscaler","Adds nodes when pods can’t be scheduled and removes empty ones."],["PodDisruptionBudget","Keeps a minimum number of pods running during drains and upgrades."],["Ingress / Gateway API","Routes external HTTP(S) to Services; a controller creates the real load balancer."],["RBAC & Pod Identity","Who may do what in the cluster, and which AWS role a pod gets, without node-wide credentials."],["External Secrets","Syncs secrets from AWS Secrets Manager into Kubernetes Secrets."]],
  flowTitle:"A deploy on a production cluster",
  flow:[["git","PR bumps the tag","manifests repository"],["gitops","Argo CD sync","staging auto, production manual"],["rollout","Deployment","maxUnavailable 0, readiness gates"],["scale","HPA + Karpenter","more pods, then more nodes"],["safety","PDB + probes","drains never drop below minimum"]],
  hot:2,
  callouts:[["warn","An EKS control plane bills hourly on top of nodes, load balancers and NAT. Give the staging cluster a budget alarm and a teardown date before you create it."],["info","Keep the manifests from {job:p7}, this job hardens them rather than starting again."]],
  tasks:[

  exit:["A node drain or cluster upgrade causes zero failed requests.","Pods get AWS access and secrets without node-wide credentials or secrets in Git.","I can explain every object in the bashbop namespace and why it’s there."],
  quiz:[["Pods are `Pending` with ‘0/3 nodes are available: insufficient memory’. What are the two fixes, and which does Karpenter do?","Lower an over-stated memory request, or add capacity. Karpenter (or Cluster Autoscaler) adds a node that fits the pod; it can’t fix a wrong request."],
        ["Your HPA never scales under load. What do you check first?","That pods have CPU requests (utilisation is a percentage of the request) and metrics-server is running, `kubectl get hpa` shows `<unknown>` targets when metrics are missing."],
        ["Why can a `maxUnavailable: 0` rollout still drop requests?","Terminating pods can still receive traffic while the load balancer deregisters them. Without readiness probes, a `preStop` delay and graceful shutdown, requests hit pods that are stopping."],
        ["What doesn’t a PodDisruptionBudget protect against?","Involuntary disruption, a node crash, the OOM killer, a zone outage. It only limits voluntary evictions such as drains and upgrades."],
        ["Why per-pod AWS roles instead of an IAM role on the node?","Every pod on a node shares the node role, so one compromised pod gets all its permissions. Pod Identity or IRSA scopes access to the workload that needs it."]],
  res:["Kubernetes Docs, Production environment; Specifying a Disruption Budget","AWS, Amazon EKS Best Practices Guide","Karpenter documentation","External Secrets Operator documentation","kube-prometheus-stack Helm chart"]

{ id:"p14", part:"job", short:"Enterprise", title:"Enterprise tooling: Ansible and Jenkins", weeks:[44,46],
  why:"Many DevOps job ads still list Ansible and Jenkins, because large companies run fleets of long-lived servers and years of Jenkins pipelines. You don’t need to love them; you need to read an existing playbook or Jenkinsfile, change it safely, and explain how they compare with Terraform and GitHub Actions. Learn both by rebuilding things you already have.",
  terms:[["Idempotency","Running a playbook twice changes nothing the second time, Ansible’s core promise."],["Inventory & groups","Which hosts exist and how they’re grouped: web, api, staging."],["Modules vs shell","`ansible.builtin.apt` knows the desired state; `shell` just runs commands and reports ‘changed’ every time."],["Roles & handlers","Reusable task bundles; handlers run once at the end when notified, such as reloading Nginx."],["Ansible Vault","Encrypts secrets inside the repository; the vault password lives outside it."],["Declarative Jenkinsfile","`pipeline { agent … stages { … } }`, Jenkins pipelines as code."],["Agents & credentials","Where builds run, and secrets bound into steps with `withCredentials`."],["Shared libraries","Reusable pipeline code across repositories, like reusable workflows in Actions."]],
  flowTitle:"Where each tool fits",
  flow:[["provision","Terraform","creates the VM and network"],["configure","Ansible","packages, users, Docker, Nginx"],["build","Jenkins or Actions","test, build, package"],["deploy","Ansible or GitOps","roll out to hosts or a cluster"],["verify","Smoke checks","health, logs, metrics"]],
  hot:1,
  callouts:[["info","The Coolify host from {job:p1} was set up by hand. Rebuild its shape on a throwaway VM as a playbook you can rerun: Docker, a service user, firewall rules and the API container, with Nginx in front. Coolify uses Traefik, but Nginx is the proxy most job ads expect you to know."],["warn","Jenkins plugins are a well-known attack surface. Run Jenkins in a throwaway local container for this job, never on a public server."]],
  tasks:[
    ["Install Ansible and write an inventory for a throwaway staging VM (or two local VMs with Multipass).",""],
    ["Write a playbook that builds an API host like the one in {job:p1} on the throwaway VM: Docker, a service user, firewall rules, the API container with a restart policy, and an Nginx site in front of it.",""],
    ["Run it twice and reach `changed=0` on the second run, replacing any `shell` task that always reports changed.",""],
    ["Split it into `docker`, `nginx` and `app` roles, with a handler that reloads Nginx only when its config changes.",""],
    ["Encrypt the API environment file with Ansible Vault and deploy it with the right owner and `0600` permissions.",""],
    ["Lint with `ansible-lint`, and test one role with Molecule against a container.",""],
    ["Run Jenkins locally in Docker (`jenkins/jenkins:lts`) and create a multibranch pipeline for bashbop-event-web.",""],
    ["Write a declarative Jenkinsfile mirroring the PR gate from {job:p2}: install, then lint, types and tests in parallel, with JUnit reports.",""],
    ["Bind a credential with `withCredentials` and prove it’s masked in the console log.",""],
    ["Write a one-page comparison: Jenkins vs GitHub Actions, and Ansible vs Terraform vs containers, when you’d pick each.",""]
  ],
  exit:["My playbook builds the API host from a blank VM and reruns with zero changes.","I can read an unfamiliar Jenkinsfile and explain every stage, agent and credential.","I can explain when Ansible, Terraform or Kubernetes is the right tool."],
  quiz:[["A task runs `shell: apt-get install -y nginx` and reports ‘changed’ every run. Why does that matter, and what’s the fix?","It breaks idempotency: handlers fire every time and real drift hides in the noise. Use `ansible.builtin.apt` with `state: present`, which reports changed only when it installs."],
        ["Terraform or Ansible to create an EC2 instance and install Nginx on it?","Terraform creates and tracks the instance in state; Ansible configures what runs inside it. Ansible can create cloud resources, but without state it can’t plan changes or detect drift the same way."],
        ["A secret appears in the Jenkins log even though it’s inside `withCredentials`. How?","Masking replaces only the exact string. If a step transforms it, base64, URL-encoding, splitting, the printed text no longer matches and isn’t masked."],
        ["What’s Jenkins’ equivalent of a reusable workflow, and of a runner label?","A shared library (`@Library`) for reusable pipeline code, and an agent label (`agent { label 'linux' }`) to choose where it runs."],
        ["Why do handlers run at the end of a play rather than immediately?","So several config changes trigger one reload instead of many, and only if something actually changed."]],
  res:["Ansible Docs, Getting started and tips for playbooks","ansible-lint and Molecule documentation","Jenkins Docs, Pipeline syntax","Jenkins Docs, Using credentials","Jeff Geerling, Ansible for DevOps"]
},

        ["In the CKA a pod won’t start and you have eight minutes. What’s your order?","`kubectl describe pod` for events, `kubectl logs --previous` if it crashed, then the image, requests, node taints and PVC binding. Events usually name the cause within a minute."],

        ["In a design round they mention a tool you don’t know. What do you do?","Say so briefly, describe what you need that component to do, and design with a tool you know that fills the role. Clear reasoning beats name-dropping."],

function txt(x,y,cls,s,anchor){return "<text class=\""+cls+"\" x=\""+x+"\" y=\""+y+"\""+(anchor?" text-anchor=\""+anchor+"\"":"")+">"+esc(s)+"</text>";}
function seq(id,lanes,steps,label){
  var W=1000,top=78,gap=34,n=lanes.length,m=90,sp=(W-2*m)/(n-1),H=top+steps.length*gap+18;
  var X=function(k){return m+k*sp;};
  var h=svgOpen(id,W,H,label);
  lanes.forEach(function(l,k){var x=X(k);h+="<line class=\"lane\" x1=\""+x+"\" y1=\"50\" x2=\""+x+"\" y2=\""+(H-6)+"\"/><rect class=\"lh\" x=\""+(x-78)+"\" y=\"12\" width=\"156\" height=\"38\" rx=\"8\"/>"+txt(x,36,"bt",l,"middle");});
  steps.forEach(function(s,k){
    var y=top+k*gap,a=X(s[0]),b=X(s[1]),c=s[3]||"";
    if(s[0]===s[1]){var w=Math.round(s[2].length*6.7+18),nx=(a+10+w>W-6)?a-10-w:a+10;h+="<rect class=\"note\" x=\""+nx+"\" y=\""+(y-14)+"\" width=\""+w+"\" height=\"22\" rx=\"5\"/>"+txt(nx+9,y+1,"nt",s[2]);}
    else{var d=b>a?1:-1;h+="<path class=\"ln"+(c?" "+c:"")+"\" d=\"M"+(a+d*4)+" "+y+" H"+(b-d*6)+"\" marker-end=\"url(#"+id+")\"/>"+txt((a+b)/2,y-6,"al w"+(c?" "+c+"t":""),s[2],"middle");}
  });
  return h+"</svg>";
}
function timeline(id,rows,bars,ticks,marks,label){
  var W=1000,L=180,R=W-24,top=50,rh=46,H=top+rows.length*rh+36;
  var X=function(t){return L+(R-L)*t/100;};
  var h=svgOpen(id,W,H,label);
  ticks.forEach(function(t){var x=X(t[0]);h+="<line class=\"tick\" x1=\""+x+"\" y1=\""+(top-4)+"\" x2=\""+x+"\" y2=\""+(top+rows.length*rh)+"\"/>"+txt(x,H-12,"bs",t[1],t[0]<3?"start":t[0]>97?"end":"middle");});
  marks.forEach(function(m){var x=X(m[0]);h+="<line class=\"mark\" x1=\""+x+"\" y1=\""+(top-12)+"\" x2=\""+x+"\" y2=\""+(top+rows.length*rh)+"\"/>"+txt(x,top-18,"al w failt",m[1],m[0]<8?"start":m[0]>88?"end":"middle");});
  rows.forEach(function(r,k){h+=txt(12,top+k*rh+27,"bt",r);});
  bars.forEach(function(b){var x=X(b[1]),w=X(b[2])-x,y=top+b[0]*rh+8;h+="<rect class=\"tbar"+(b[4]?" "+b[4]:"")+"\" x=\""+x+"\" y=\""+y+"\" width=\""+w+"\" height=\"28\" rx=\"5\"/>"+txt(x+8,y+18,"nt",b[3]);});
  return h+"</svg>";
}

    points:[["DNS answers with Cloudflare, not you","A proxied record returns edge IPs, so `dig` never shows your server. If your origin IP leaks, attackers can skip Cloudflare entirely."],["Two TLS connections, not one","Browser to edge uses Cloudflare’s certificate; edge to origin uses yours. ‘Full (strict)’ makes Cloudflare verify the second one."],["Traefik is a second client","It opens its own connection to the container. A 502 means that hop failed, even when DNS and TLS are fine."],["Every hop leaves evidence","`cf-ray` identifies the edge request; `CF-Connecting-IP` carries the real client IP into your logs."]],

  p8:{title:"Signing, notarisation and the update check",
    caption:"Two trust chains. Apple vouches for the binary through signing and notarisation; the feed tells every installed copy what to download and how to verify it.",
    points:[["The keychain step is where CI breaks","A runner has no keychain holding your certificate. electron-builder creates a temporary one, imports `CSC_LINK` and must unlock it, your failing step."],["Notarisation needs the hardened runtime","Apple rejects signed apps without it. Stapling attaches the ticket so Gatekeeper can check it offline."],["The feed is a contract","The app trusts `latest-mac.yml`: version, file name, size and `sha512`. Any mismatch is a failed or rejected update."],["Old versions run old updaters","2.5.0 checks for updates with the code 2.5.0 shipped. Test updates from real old builds, not just fresh installs."]],
    svg:function(){return seq("hw3",["CI runner","Apple notary","R2 update feed","Parent’s Mac"],[[0,0,"import .p12 into temp keychain"],[0,0,"codesign with hardened runtime"],[0,1,"notarytool submit"],[1,1,"scan + verify signature"],[1,0,"accepted"],[0,0,"stapler staple"],[0,2,"upload dmg, zip, blockmaps"],[0,2,"upload latest-mac.yml last","hot"],[3,2,"GET latest-mac.yml"],[3,3,"2.6.1 > 2.6.0: show ‘Update’"],[3,2,"GET zip (blockmap diff)"],[3,3,"verify sha512, install on quit"]],"Sequence: the CI runner signs with a temporary keychain, submits to Apple for notarisation, staples the ticket and uploads installers then the feed; the installed app fetches the feed, compares versions, downloads the zip and verifies its hash.");}},
  p3:{title:"How a container is isolated",
    caption:"Containers are ordinary processes that the shared kernel fences in with namespaces and limits with cgroups. The image is a stack of read-only layers with one thin writable layer on top.",
    points:[["No kernel of its own","Both containers make system calls to the same host kernel, much lighter than a VM, which is also why a kernel bug can cross containers."],["Namespaces decide what a process sees","Its own process tree, network interface, hostname and mounts. Inside, `ps` shows `node` as PID 1."],["cgroups decide what it can use","Exceed the memory limit and the kernel kills the process: exit code 137, `OOMKilled: true`."],["Layers are cached and shared","Every image built on `node:20-alpine` shares that layer on disk. Runtime writes land in the writable layer and vanish with the container."]],
    svg:function(){var i="hw4",h=svgOpen(i,1000,400,"Two containers, bashbop-web and bashbop-api, each with pid, net and mount namespaces and a cgroup limit, share one host kernel; the web image is a stack of read-only layers under a writable layer.");
      h+=zone(30,40,270,280,"CONTAINER · bashbop-web")+zone(320,40,270,280,"CONTAINER · bashbop-api");
      [["pid namespace","sees only its processes"],["net namespace","own interface, :80"],["mnt namespace","own root filesystem"],["cgroup","memory limit 1 GiB"]].forEach(function(b,k){h+=box(45,70+k*60,240,48,b[0],b[1]);});
      [["pid namespace","PID 1 is node"],["net namespace","own interface, :9999"],["mnt namespace","its own image layers"],["cgroup","CPU and memory limits"]].forEach(function(b,k){h+=box(335,70+k*60,240,48,b[0],b[1]);});
      h+=box(30,344,560,48,"Host Linux kernel, shared","namespaces and cgroups are kernel features")+arw(i,"M165 320 V344","syscalls",172,336,"start")+arw(i,"M455 320 V344","syscalls",462,336,"start");
      h+=zone(630,40,350,352,"IMAGE · web runner stage");
      [["Writable layer","runtime writes, lost on removal","hot"],["COPY .next/static","hashed JS and CSS"],["COPY .next/standalone","server.js + traced node_modules"],["COPY public/","images, fonts"],["RUN adduser nextjs","uid 1001"],["FROM node:20-alpine","shared by images built on it"]].forEach(function(b,k){h+=box(650,70+k*52,310,44,b[0],b[1],b[2]);});
      return h+"</svg>";}},
  p10:{title:"Inside a two-AZ VPC",
    caption:"Only the load balancer and NAT gateway sit in public subnets. The API and database have no public addresses, and each security group admits traffic only from the group in front of it.",
    points:[["Public by route, not by name","A subnet is public because its route table sends `0.0.0.0/0` to an internet gateway. Private subnets send it to a NAT gateway."],["Security groups chain","ALB group → app group → database group. Nothing else reaches port 5432, even from inside the VPC."],["Two AZs or it isn’t highly available","Load balancer nodes, tasks and the database standby span both zones, so losing one data centre costs capacity, not the service."],["Egress is metered","Every call to Stripe or OpenAI leaves through the NAT gateway, which charges per GB processed on top of its hourly fee."]],
    svg:function(){var i="hw5";return svgOpen(i,1000,470,"A VPC across two availability zones: Cloudflare reaches load balancer nodes in public subnets, which reach API tasks in private subnets, which reach Postgres in isolated subnets; API egress goes through a NAT gateway to Stripe and OpenAI.")+

  p4:{title:"Expand–contract: renaming a column with zero downtime",
    caption:"Renaming a column safely takes four releases. At every step the version being deployed and the one it replaces both work with the schema that exists, so a rollback never meets a missing column.",
    points:[["Rolling deploys run two versions","For a few minutes old and new pods serve traffic against one database, so every schema change must suit both."],["Expand, migrate, contract","Add the new shape, dual-write, backfill, switch reads, stop the old writes, and only then drop the old column."],["Rollback stays safe","Until the final release, rolling back one step never meets a column that isn’t there."],["Migrations run before the app","`prisma migrate deploy` in a gated step, so new code never starts against an older schema."]],
    svg:function(){return timeline("hw6",["Schema","Writes","Reads","Backfill"],[[0,0,15,"venue"],[0,15,85,"venue + location_name"],[0,85,100,"new only","pass"],[1,0,15,"venue"],[1,15,65,"both columns"],[1,65,100,"location_name"],[2,0,40,"venue"],[2,40,100,"location_name"],[3,18,38,"copy old rows","gap"]],[[0,"before"],[15,"R1"],[40,"R2"],[65,"R3"],[85,"R4"],[100,"done"]],[[15,"R1 add column"],[40,"R2 read new"],[65,"R3 stop old writes"],[85,"R4 drop venue"]],"Timeline of renaming venue to location_name over four releases: add the column and dual-write, backfill, switch reads, stop writing the old column, then drop it.");}},
  p9:{title:"Why KV counters drift at the edge",
    caption:"Two locations read the same cached counter, both allow the request, and both write 10. That’s why the Worker treats its KV throttle as best-effort and relies on a Rate Limiting rule as the hard cap.",
    points:[["A Worker is an isolate, not a server","Each request runs in a V8 isolate at the nearest location, started in milliseconds. Memory isn’t shared between locations."],["KV reads can be stale","Reads come from caches near the user and can lag a write made elsewhere by up to about a minute."],["KV has no atomic increment","Get-then-put loses concurrent updates. Use a Rate Limiting rule or Durable Objects when a limit must be exact."],["D1 is where correctness lives","`startTrial` does the device check and the insert in one SQL statement, so parallel activations can’t both create a trial."]],
    svg:function(){return seq("hw7",["Request A","Edge London","Workers KV","Edge Lagos","Request B"],[[0,1,"POST /start"],[4,3,"POST /start"],[1,2,"get rl:key"],[2,1,"9"],[3,2,"get rl:key"],[2,3,"9 (cached copy)"],[1,1,"9 < 10: allow"],[3,3,"9 < 10: allow","fail"],[1,2,"put rl:key = 10"],[3,2,"put rl:key = 10","fail"],[2,2,"stored 10, 11 got through"]],"Sequence: two Worker locations read the same KV counter value 9 at the same time, both allow their request and both write 10, so one request beyond the limit gets through.");}},
  p5:{title:"What plan and apply actually compare",
    caption:"Plan compares three things, your code, the last recorded state and what really exists, and apply changes the world to match the reviewed plan, then records the result.",
    points:[["State is Terraform’s memory","It maps every resource address to a real ID. Lose it and Terraform thinks nothing exists; share it without locking and two applies corrupt it."],["Refresh finds drift","Plan reads the real resources first, so a dashboard edit shows up as a change to undo."],["Addresses are identity","Rename a resource block and Terraform sees a delete plus a create, unless you add a `moved` block."],["Apply what you reviewed","`terraform plan -out=tfplan` then `terraform apply tfplan` makes CI apply exactly what the PR showed."]],
    svg:function(){var i="hw8";return svgOpen(i,1000,360,"terraform plan reads the .tf files, the state and a refresh of the Cloudflare API to produce a plan; terraform apply executes the saved plan against the API and writes the new state.")+
      box(20,60,200,56,".tf files","desired state, in Git")+box(20,260,200,56,"State","last known · locked")+
      box(300,160,190,56,"terraform plan","refresh + diff","hot")+box(570,160,190,56,"terraform apply","runs the saved plan")+box(790,60,190,56,"Cloudflare API","what actually exists")+
      arw(i,"M220 88 H260 V178 H300","reads",240,80)+arw(i,"M220 288 H260 V198 H300","reads",240,306)+
      arw(i,"M885 116 V136 H395 V160","refresh",640,128)+arw(i,"M490 188 H570","saved plan",530,180)+
      arw(i,"M665 160 V88 H790","create / update / delete",782,80,"end")+arw(i,"M665 216 V340 H120 V316","writes new state",392,334)+"</svg>";}},
  p11:{title:"Where the supply chain gets attacked",
    caption:"Attackers take the cheapest hop. Each red line is a real path into bashbop or Brain Boost Buddy; the grey line under it is the control that closes it.",
    points:[["Tags are mutable","`@v4` is a pointer its owner, or anyone holding their token, can move. A 40-character commit SHA can’t be."],["The token is the blast radius","Whatever `permissions:` and secrets a job holds, a compromised step holds too. Start from `permissions: {}`."],["Lockfiles make installs repeatable","`yarn install --immutable` fails if the lockfile would change, so CI installs exactly what was reviewed."],["Provenance and a signature close the loop","Provenance ties the image digest to the commit and workflow that built it; a signature proves your pipeline pushed it. Verify before deploying."]],
    svg:function(){var i="hw9",h=svgOpen(i,1000,310,"Supply chain from laptop to GitHub to the Actions runner, which installs dependencies, publishes to a registry and deploys to production; each hop lists its main attack and control.");
      var cols=[["Your laptop","commits, tokens","stolen session","MFA, disk encryption"],["GitHub","source and PRs","secret committed","gitleaks check"],["Actions runner","builds and deploys","moved action tag","pin SHA, perms: {}"],["Registry","image + provenance","swapped image","sign and verify"],["Production","runs the image","long-lived keys","OIDC, rotation"]];
      cols.forEach(function(c,k){var x=20+k*205;h+=box(x,70,150,56,c[0],c[1],k===2?"hot":"")+txt(x+8,150,"al w failt",c[2])+txt(x+8,168,"bs",c[3]);if(k<4)h+=arw(i,"M"+(x+150)+" 98 H"+(x+205),["push","triggers","publishes","deploys"][k],x+177,62);});
      h+=box(225,200,150,56,"Dependencies","npm, actions, images")+txt(233,280,"al w failt","compromised package")+txt(233,298,"bs","lockfile, review, audit")+arw(i,"M375 228 H402 V112 H430","installed",410,196,"start");
      return h+"</svg>";}},
  p6:{title:"One trace across web, API and a webhook",
    caption:"The checkout is one trace across web, API and Postgres. Stripe’s webhook arrives later as a separate trace, joined only by the booking id you record on both.",
    points:[["A trace is a tree of spans","Each hop records start, duration and attributes under one trace id, so a slow checkout shows exactly which hop was slow."],["`traceparent` carries the context","`00-<trace-id>-<parent-span-id>-01`, instrumented clients add it, instrumented servers continue it."],["Webhooks break the chain","Stripe’s callback isn’t a child of your request. Put `booking_id` on both traces, or add a span link, to join them."],["Measure the gap","Time from payment intent to confirmed booking is your webhook-lag SLI. Alert when its p95 climbs."]],
    svg:function(){return seq("hw10",["Browser","bashbop-web","bashbop-api","PostgreSQL","Stripe"],[[0,1,"POST checkout: trace starts"],[1,2,"traceparent: 00-4bf9…-01","hot"],[2,3,"span: insert booking (pending)"],[2,4,"span: create PaymentIntent"],[2,0,"client secret"],[0,4,"confirm payment (Stripe.js)"],[4,2,"webhook: payment_intent.succeeded"],[2,2,"new trace · booking_id links it"],[2,3,"span: booking → confirmed"]],"Sequence: a checkout trace flows from browser to web to API with a traceparent header, creating spans for the database insert and the Stripe payment intent; the Stripe webhook later starts a new trace linked by booking id.");}},
  p7:{title:"Point-in-time recovery, and the loop behind Kubernetes",
    caption:"Point-in-time recovery starts from the last base backup and replays the write-ahead log to just before the mistake, into a new instance, so nothing written since is lost.",
    points:[["Backups alone lose a day","A 02:00 dump can’t bring back twelve hours of bookings before a 14:32 mistake. Replaying the WAL can."],["RPO and RTO are measured","RPO is how far back the last recoverable point is; RTO is how long your last real restore took."],["Pools protect Postgres","Each connection is a server process. A pool caps them, so a traffic spike queues instead of exhausting `max_connections`."],["Kubernetes is a control loop","You declare desired state; controllers keep comparing it with reality and act, the same idea as Terraform, running forever."]],
    svg:function(){return timeline("hw11",["Base backups","WAL archive","Production data","Restore target"],[[0,0,12,"Mon 02:00","pass"],[0,35,47,"Tue 02:00","pass"],[1,0,100,"every committed change, continuously"],[2,0,70,"healthy"],[2,70,100,"rows deleted","fail"],[3,35,69,"Tue 02:00 base + WAL to 14:31"]],[[0,"Mon 02:00"],[35,"Tue 02:00"],[70,"14:32"],[100,"now"]],[[70,"DELETE at 14:32"]],"Timeline: nightly base backups and a continuous WAL archive; production rows are deleted at 14:32; the restore target replays WAL from the Tuesday 02:00 backup to 14:31.");}},
  p12:{title:"An incident against the clock",
    caption:"One capstone fault plotted against the clock. Detection is the widest bar, so that’s where the review should focus first.",
    points:[["Detect, mitigate, resolve","Mitigation ends customer impact (roll back, flip a flag); resolution fixes the cause. Track both times."],["Roles beat heroics","One commander decides and communicates; operators investigate. Handing over a role is fine, silently doing both isn’t."],["Timestamps are raw material","Write them in the incident channel as things happen. Memory rewrites timelines within hours."],["The review is the product","A game day that produces no tracked action items was just downtime."]],
    svg:function(){return timeline("hw12",["Fault active","Detection","Response","Status updates"],[[0,5,58,"bookings stuck pending","fail"],[1,5,42,"undetected ≈ 22 min","gap"],[2,42,58,"mitigate"],[2,58,85,"resolve + verify","pass"],[3,44,85,"every 15 min"]],[[0,"0 min"],[25,"15"],[50,"30"],[75,"45"],[100,"60"]],[[5,"fault"],[42,"alert"],[58,"mitigated"],[85,"resolved"]],"Timeline over 60 minutes: a fault starts at 3 minutes, goes undetected until an alert at about 25 minutes, is mitigated at about 35 minutes and resolved at about 51 minutes, with status updates every 15 minutes.");}}

HOW.p13={title:"What happens after kubectl apply",
  caption:"A Deployment becomes running pods through independent control loops that only ever talk to the API server. Nothing calls the scheduler or a kubelet directly.",
  points:[["Everything goes through the API server","kubectl, controllers, the scheduler and kubelets never talk to each other, they read and write objects through the API server, which stores them in etcd."],["Controllers are loops, not scripts","Each watches for a gap between desired and observed state and acts. Delete a pod and the ReplicaSet controller simply notices one is missing."],["Scheduling uses requests, not usage","The scheduler filters nodes by unrequested capacity, taints and affinity, then scores them. A pod without requests can land anywhere and starve its neighbours."],["Ready is what routes traffic","Only pods whose readiness probe passes become Service endpoints, which is why probes decide whether a rollout drops requests."]],
  svg:function(){return seq("hw13",["kubectl","API server","etcd","Controllers","Scheduler","kubelet"],[[0,1,"apply Deployment"],[1,1,"authn · RBAC · admission"],[1,2,"store desired"],[3,1,"watch → create ReplicaSet + Pods"],[4,1,"watch: Pods with no node"],[4,4,"filter + score nodes"],[4,1,"bind Pod to node-b"],[5,1,"watch: Pod bound to me"],[5,5,"pull image, start container","hot"],[5,1,"status: Ready (probe passed)"],[1,2,"store observed"]],"Sequence: kubectl applies a Deployment to the API server, which stores it in etcd; controllers create a ReplicaSet and Pods, the scheduler binds each Pod to a node, and the kubelet starts the container and reports Ready.");}};
HOW.p14={title:"How Ansible and Jenkins actually run",
  caption:"Left: Ansible connects to a host over SSH, checks the current state, changes only what differs and fires a handler once. Right: a Jenkins controller schedules a build on an agent and collects the results.",
  points:[["Ansible is agentless push","A control node connects over SSH, copies a small module, runs it and reads JSON back. Nothing stays running on the host."],["Modules check before they change","Each module compares current state first, so ‘ok’ means already correct and ‘changed’ means it acted, the basis of idempotency."],["Jenkins splits controller and agents","The controller schedules and stores results; agents run builds. Building on the controller is a security and stability mistake."],["Both need real secret handling","Vault-encrypted variables for Ansible, the credentials store for Jenkins, never plain text in a repo or job config."]],
  svg:function(){return seq("hw14",["Ansible control","api-1 host","Jenkins controller","Jenkins agent"],[[0,0,"read inventory + playbook"],[0,1,"SSH: run apt module"],[1,1,"nginx present → ok"],[0,1,"SSH: template api.conf"],[1,0,"changed → notify handler"],[0,1,"handler: reload nginx (once)","hot"],[2,2,"webhook: push to main"],[2,3,"run on agent label linux"],[3,3,"checkout, stages in parallel"],[3,2,"JUnit results + status"]],"Sequence: the Ansible control node runs modules on a host over SSH, gets ok or changed back and reloads Nginx once through a handler; separately, a Jenkins controller receives a webhook, schedules a build on an agent and collects results.");}};
HOW.p15={title:"Four weeks from booking to exam",
  caption:"Baseline early, close gaps first, study daily, and only sit the exam after two timed practice runs at 80% or better.",
  points:[["Baseline before studying","A cold practice exam shows where you really are, usually not where you think."],["Gaps first, strengths never","Map objectives to what you’ve done, then spend study time only on the unmapped ones."],["Practise the format","Timed runs build pacing. For the CKA, speed with `kubectl` matters as much as knowledge."],["A booked date is the plan","Without a date, ‘almost ready’ lasts forever. Book it and fit the plan to it."]],
  svg:function(){return timeline("hw15",["Map & gaps","Daily study","Practice exams","Simulator / labs","Exam"],[[0,0,15,"map objectives"],[0,15,32,"close top gaps","gap"],[1,15,92,"45–60 minutes a day"],[2,2,14,"cold baseline"],[2,36,47,"practice 1"],[2,58,69,"practice 2"],[2,78,90,"80%+ twice","pass"],[3,6,20,"simulator 1"],[3,79,92,"simulator 2"],[4,94,100,"exam","pass"]],[[0,"week 0"],[25,"week 1"],[50,"week 2"],[75,"week 3"],[100,"week 4"]],[[94,"exam day"]],"Timeline over four weeks: map objectives and close gaps in the first week or so, study daily throughout, take a cold baseline and then practice exams until scoring 80% twice, with simulator sessions early and late, and the exam at the end of week four.");}};
HOW.p16={title:"How a troubleshooting round is scored",
  caption:"The loop interviewers want to hear out loud: clarify, form a hypothesis, test it cheaply, narrow down, and finish with a fix plus prevention.",
  points:[["Method beats the answer","Rubrics score how you narrow the problem. Candidates who find the bug by guessing still fail."],["Clarify before touching anything","Scope, impact and ‘what changed?’ often point straight at the cause."],["Cheap checks first","`curl`, logs and `kubectl describe` before restarts or redeploys, and say why you chose each."],["Always end with prevention","Naming the alert or test that would have caught it shows real production experience."]],
  svg:function(){var i="hw16",h=svgOpen(i,1000,290,"Troubleshooting loop: clarify, hypothesise, test, narrow, then fix and prevent; if a test rules a hypothesis out, return to hypothesise. Below each step, what the interviewer scores.");
    var st=[["Clarify","scope, impact, change"],["Hypothesise","most likely layer"],["Test","one cheap check"],["Narrow","rule in or out"],["Fix + prevent","mitigate, then root cause"]],sc=["asks before acting","reasons out loud","cheap checks first","follows evidence","names the alert"];
    st.forEach(function(b,k){var x=20+k*195;h+=box(x,70,165,56,b[0],b[1],k===2?"hot":"")+txt(x+8,250,"bs",sc[k]);if(k<4)h+=arw(i,"M"+(x+165)+" 98 H"+(x+195));});
    h+=arw(i,"M702 126 V176 H312 V126","ruled out → next hypothesis",507,168)+txt(20,226,"zl","WHAT THEY SCORE");
    return h+"</svg>";}};

function zone(x,y,w,h,l){return "<rect class=\"zone\" x=\""+x+"\" y=\""+y+"\" width=\""+w+"\" height=\""+h+"\" rx=\"10\"/><text class=\"zl\" x=\""+(x+12)+"\" y=\""+(y+20)+"\">"+esc(l)+"</text>";}
function box(x,y,w,h,t,s,c){return "<rect class=\"box"+(c?" "+c:"")+"\" x=\""+x+"\" y=\""+y+"\" width=\""+w+"\" height=\""+h+"\" rx=\"8\"/><text class=\"bt\" x=\""+(x+12)+"\" y=\""+(y+h/2-4)+"\">"+esc(t)+"</text>"+(s?"<text class=\"bs\" x=\""+(x+12)+"\" y=\""+(y+h/2+13)+"\">"+esc(s)+"</text>":"");}
function arw(id,d,l,lx,ly,a,c){return "<path class=\"ln"+(c?" "+c:"")+"\" d=\""+d+"\" marker-end=\"url(#"+id+")\"/>"+(l?"<text class=\"al"+(c==="gap"?" gapt":"")+"\" x=\""+lx+"\" y=\""+ly+"\" text-anchor=\""+(a||"middle")+"\">"+esc(l)+"</text>":"");}
function svgOpen(id,w,h,label){return "<svg viewBox=\"0 0 "+w+" "+h+"\" role=\"img\" aria-label=\""+esc(label)+"\" xmlns=\"http://www.w3.org/2000/svg\" style=\"color:var(--ink-3)\"><defs><marker id=\""+id+"\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/></marker></defs>";}
function key(x,y,c,l){return "<rect class=\"box "+c+"\" x=\""+x+"\" y=\""+y+"\" width=\"22\" height=\"12\" rx=\"3\"/><text class=\"bs\" x=\""+(x+30)+"\" y=\""+(y+10)+"\">"+esc(l)+"</text>";}

    caption:"Guests reach both apps through Cloudflare. The API owns Postgres, Redis, R2 uploads and every third-party call; payment providers call back through webhooks, and the browser also talks to GetStream directly for video. Dashed amber marks what isn’t defined in code or deployed by CI.",
