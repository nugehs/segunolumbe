<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bashbop DevOps Track</title>
<meta name="description" content="A nine-job, progress-tracked DevOps learning path across bashbop and Brain Boost Buddy, with architecture diagrams and worked examples.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚦</text></svg>">
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style id="app-css">
:root{
  --ground:#F2F4F7;--surface:#FFFFFF;--sunk:#E9EDF3;--ink:#142033;--ink-2:#4A5669;--ink-3:#7A8699;--line:#D5DBE4;
  --accent:#2A4FD6;--accent-ink:#FFFFFF;--accent-soft:#E3E9FB;
  --pass:#1F8A4C;--pass-soft:#DDF1E5;--run:#B86E00;--run-soft:#FBEBD2;--fail:#C9362B;--fail-soft:#F8E0DD;--queued:#9AA5B5;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E141D;--surface:#161E2A;--sunk:#1C2533;--ink:#E6EBF2;--ink-2:#A3AEBF;--ink-3:#6F7B8E;--line:#283345;
  --accent:#86A2FF;--accent-ink:#0E141D;--accent-soft:#1D2848;
  --pass:#4CC784;--pass-soft:#16301F;--run:#F0A93B;--run-soft:#33260F;--fail:#F0685C;--fail-soft:#3A1B18;--queued:#5C687A;color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#0E141D;--surface:#161E2A;--sunk:#1C2533;--ink:#E6EBF2;--ink-2:#A3AEBF;--ink-3:#6F7B8E;--line:#283345;
  --accent:#86A2FF;--accent-ink:#0E141D;--accent-soft:#1D2848;
  --pass:#4CC784;--pass-soft:#16301F;--run:#F0A93B;--run-soft:#33260F;--fail:#F0685C;--fail-soft:#3A1B18;--queued:#5C687A;color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font:0.86em/1.4 var(--mono);background:var(--sunk);border:1px solid var(--line);padding:.05em .38em;border-radius:4px;word-break:break-word}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}

/* top bar */
.top{display:flex;align-items:center;gap:20px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font:800 15px/1 var(--display);font-stretch:112%;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.rail{flex:1;display:flex;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.job{display:flex;align-items:center;gap:7px;border:0;background:none;padding:4px 6px;cursor:pointer;white-space:nowrap;border-radius:6px;font:500 12px/1 var(--mono);color:var(--ink-2)}
.job:hover{background:var(--sunk)}
.job.here{color:var(--ink);background:var(--accent-soft)}
.wire{flex:1;min-width:10px;height:2px;background:var(--line);position:relative;overflow:hidden}
.wire.lit{background:var(--pass)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--queued);display:grid;place-items:center;flex:none}
.dot.passed{background:var(--pass);border-color:var(--pass)}
.dot.passed::after{content:"";width:5px;height:3px;border:solid var(--surface);border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.dot.running{border-color:var(--run);position:relative}
.dot.running::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--run);animation:pulse 1.6s ease-in-out infinite}
.chip{font:500 12px/1 var(--mono);padding:7px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;display:flex;align-items:center;gap:7px;background:var(--surface)}
.chip b{width:7px;height:7px;border-radius:50%;background:var(--queued)}
.chip[data-s="saved"] b{background:var(--pass)}
.chip[data-s="unsaved"] b,.chip[data-s="saving"] b{background:var(--run)}
.chip[data-s="error"] b,.chip[data-s="conflict"] b{background:var(--fail)}
.chip button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 9px;font:600 11px/1 var(--mono);cursor:pointer}

/* stage */
.stage{overflow:hidden;position:relative}
.slide{position:absolute;inset:0;overflow-y:auto;padding:clamp(24px,5vh,56px) clamp(18px,5vw,64px) 40px}
.inner{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.slide.in-next{animation:inR .42s cubic-bezier(.2,.7,.2,1) both}
.slide.in-prev{animation:inL .42s cubic-bezier(.2,.7,.2,1) both}
.slide.animate [data-a]{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 55ms + 120ms)}
@keyframes inR{from{transform:translateX(40px);opacity:.0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-40px);opacity:.0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(.55);opacity:.5}}
@keyframes flow{to{background-position:-24px 0}}

.eyebrow{font:500 12px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.eyebrow .st{letter-spacing:.04em}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(40px,7vw,84px);line-height:.95;font-weight:850;font-stretch:118%;letter-spacing:-.035em}
h2{font-size:clamp(30px,4.6vw,54px);line-height:1;font-weight:800;font-stretch:114%;letter-spacing:-.03em}
h3{font-size:19px;line-height:1.2;font-weight:700;font-stretch:108%;letter-spacing:-.01em}
.lede{font-size:clamp(17px,1.6vw,20px);color:var(--ink-2);max-width:62ch;margin:0}
p{margin:0;max-width:68ch}
.muted{color:var(--ink-2)}
.small{font-size:14px}

.pill{font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:5px;white-space:nowrap}
.pill.passed{background:var(--pass-soft);color:var(--pass)}
.pill.running{background:var(--run-soft);color:var(--run)}
.pill.queued{background:var(--sunk);color:var(--ink-2)}
.pill.risk{background:var(--fail-soft);color:var(--fail)}
.pill.warn{background:var(--run-soft);color:var(--run)}
.pill.good{background:var(--pass-soft);color:var(--pass)}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}

/* cover run graph */
.run{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.runrow{display:grid;grid-template-columns:28px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.runrow:first-child{border-top:0}
.runrow:hover{background:var(--sunk)}
.runrow .nm{font-weight:600}
.runrow .meta{font:12px/1.3 var(--mono);color:var(--ink-3)}
.bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--pass);border-radius:2px;transition:width .4s}
.runrow .right{display:flex;align-items:center;gap:10px;font:12px var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:28px;align-items:end}
.stat .n{font:800 44px/1 var(--display);font-stretch:112%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{font:12px/1.3 var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:12px var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* loop */
.loop{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.loop>div{padding:20px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.loop>div:first-child{border-left:0}
.loop .k{font:600 12px var(--mono);color:var(--accent)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;font-size:14px}
kbd{font:600 12px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 7px;background:var(--surface);white-space:nowrap}

/* audit */
.findings{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.finding{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:start;padding:13px 16px;border-top:1px solid var(--line)}
.finding:first-child{border-top:0}
.finding .fix{font:12px var(--mono);color:var(--ink-3);white-space:nowrap;border:0;background:none;cursor:pointer;padding:0}
.finding .fix:hover{color:var(--accent)}
.strengths{display:flex;flex-wrap:wrap;gap:8px}
.strengths span{font-size:14px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--surface)}

/* concepts */
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.term b{font:600 14px/1.3 var(--mono);color:var(--ink)}
.term span{font-size:14px;color:var(--ink-2)}

/* flow diagram */
.flow{display:flex;align-items:stretch;overflow-x:auto;padding:6px 2px 14px}
.node{flex:1 0 150px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative}
.node .tag{font:600 11px var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.node .t{font:700 16px/1.2 var(--display);font-stretch:106%}
.node .s{font-size:13px;color:var(--ink-2)}
.node.gap{border-style:dashed;border-color:var(--run)}
.node.gap .tag{color:var(--run)}
.node.hot{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.link{flex:0 0 34px;align-self:center;height:2px;background-image:linear-gradient(90deg,var(--accent) 50%,transparent 50%);background-size:12px 2px;animation:flow 1s linear infinite;position:relative}
.link::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--accent);border-right:0}
.callouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.callout{border-left:3px solid var(--run);padding:4px 0 4px 14px;font-size:15px;color:var(--ink-2)}
.callout.info{border-left-color:var(--accent)}

/* lab */
.labhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px}
.count{font:800 34px/1 var(--display);font-stretch:110%;font-variant-numeric:tabular-nums}
.count small{font:500 13px var(--mono);color:var(--ink-3);margin-left:6px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.task{border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task label{display:grid;grid-template-columns:22px 1fr;gap:14px;padding:13px 16px;cursor:pointer;align-items:start}
.task label:hover{background:var(--sunk)}
.task input{appearance:none;width:20px;height:20px;margin:2px 0 0;border:2px solid var(--queued);border-radius:5px;display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.task input:checked{background:var(--pass);border-color:var(--pass)}
.task input:checked::after{content:"";width:9px;height:5px;border:solid var(--surface);border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.task input:checked:not(.settled)::after{animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(-1px) rotate(-45deg) scale(.2)}}
.task .tx{display:flex;flex-direction:column;gap:3px}
.task .why{font-size:13.5px;color:var(--ink-3)}
.task.done .main{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line);text-decoration-thickness:2px}

/* check */
details.q{border-top:1px solid var(--line);padding:12px 0}
details.q:first-of-type{border-top:0;padding-top:0}
details.q summary{cursor:pointer;font-weight:600;list-style:none;display:grid;grid-template-columns:18px 1fr;gap:10px}
details.q summary::before{content:"+";font:600 16px/1.4 var(--mono);color:var(--accent)}
details.q[open] summary::before{content:"−"}
details.q summary::-webkit-details-marker{display:none}
details.q p{margin:8px 0 0 28px;color:var(--ink-2);font-size:15px}
textarea{width:100%;min-height:120px;resize:vertical;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;font:14px/1.5 var(--mono)}
.res{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.res li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.res li::before{content:"↗";color:var(--accent);font-family:var(--mono)}

/* architecture */
.arch{margin:0;display:flex;flex-direction:column;gap:12px}
.svgwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.arch svg{display:block;width:100%;min-width:760px;height:auto}
.arch figcaption{font-size:14.5px;color:var(--ink-2);max-width:86ch}
.arch .zone{fill:var(--sunk)}
.arch .zl{font:600 11px var(--mono);letter-spacing:.06em;fill:var(--ink-3)}
.arch .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.arch .box.hot{stroke:var(--accent);stroke-width:2}
.arch .box.gap{stroke:var(--run);stroke-dasharray:5 4}
.arch .box.fail{stroke:var(--fail);stroke-width:2}
.arch .bt{font:700 13px var(--body);fill:var(--ink)}
.arch .bs{font:11px var(--mono);fill:var(--ink-2)}
.arch .ln{stroke:var(--ink-3);stroke-width:1.5;fill:none}
.arch .ln.gap{stroke:var(--run);stroke-dasharray:5 4}
.arch .ah{fill:var(--ink-3)}
.arch .al{font:11px var(--mono);fill:var(--ink-2);paint-order:stroke;stroke:var(--sunk);stroke-width:4px;stroke-linejoin:round}
.arch .al.gapt{fill:var(--run)}
.jobchips{display:flex;flex-wrap:wrap;gap:8px}
.jobchips button{font-size:14px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface);cursor:pointer;display:flex;gap:8px;align-items:center}
.jobchips button:hover{border-color:var(--accent)}
.jobchips b{font:600 11px var(--mono);color:var(--accent)}

/* deep dive */
.deep{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.deep{grid-template-columns:1fr}}
.codes{display:flex;flex-direction:column;gap:14px;min-width:0}
.codehead{font:12px var(--mono);color:var(--ink-3);margin-bottom:6px}
pre.code{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;font:12.5px/1.6 var(--mono);color:var(--ink);tab-size:2}
pre.code code{background:none;border:0;padding:0;font:inherit;word-break:normal}
pre.code .c{color:var(--ink-3)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:15px;color:var(--ink-2)}
.steps li::before{counter-increment:s;content:counter(s);font:600 12px/22px var(--mono);width:22px;height:22px;text-align:center;border-radius:50%;background:var(--accent-soft);color:var(--accent)}
.steps li b{color:var(--ink);font-weight:600;display:block}

/* bottom */
.bottom{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);background:var(--surface)}
.nav{display:flex;gap:8px}
.nav button{width:40px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font:600 16px var(--mono)}
.nav button:hover:not(:disabled){border-color:var(--ink-3)}
.nav button:disabled{opacity:.35;cursor:default}
.where{display:flex;flex-direction:column;gap:6px;min-width:0}
.where .lbl{font:12px/1 var(--mono);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden}
.track span{display:block;height:100%;background:var(--accent);transition:width .35s}
.ovbtn{font:500 12px var(--mono);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;cursor:pointer;white-space:nowrap}

/* overview */
.overview{position:fixed;inset:0;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(6px);overflow-y:auto;padding:40px clamp(16px,5vw,60px);z-index:10}
.ovgrid{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.ovgroup h3{margin-bottom:10px;display:flex;gap:10px;align-items:center}
.ovcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ovcard{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.ovcard:hover{border-color:var(--accent)}
.ovcard.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ovcard span{font:11px var(--mono);color:var(--ink-3)}

@media (max-width:760px){
  .top{flex-wrap:wrap;gap:10px}
  .rail{order:3;flex-basis:100%}
  .job .jl{display:none}
  .finding{grid-template-columns:1fr}
  .flow{flex-direction:column}
  .link{flex:0 0 26px;width:2px;height:auto;align-self:center;background-image:linear-gradient(180deg,var(--accent) 50%,transparent 50%);background-size:2px 12px}
  .link::after{right:-4px;top:auto;bottom:-1px;border:5px solid transparent;border-top-color:var(--accent);border-bottom:0}
  .ovbtn{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

DEEP.p1={title:"Read the proxy in front of your API",
  intro:"An annotated Nginx site for an API behind Cloudflare. Compare it line by line with what `nginx -T` prints on your server.",
  files:[["/etc/nginx/sites-enabled/api.conf (example)",`server {
  listen 443 ssl;
  server_name api.example.com;                # your API hostname

  ssl_certificate     /etc/ssl/cf-origin.pem;  # Cloudflare Origin CA cert
  ssl_certificate_key /etc/ssl/cf-origin.key;  # makes Full (strict) possible

  client_max_body_size 20m;                   # event image uploads

  # trust Cloudflare for the real client IP
  set_real_ip_from 173.245.48.0/20;           # one line per Cloudflare range
  real_ip_header CF-Connecting-IP;

  location / {
    proxy_pass http://127.0.0.1:9999;         # the port the API listens on
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;   # websockets
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}`]],
  steps:[["Find yours","`sudo nginx -T` prints the full running config, every include expanded."],["Test before reload","`sudo nginx -t && sudo systemctl reload nginx` — reload keeps open connections; restart drops them."],["Bypass one layer at a time","`curl` the API on `127.0.0.1` from the server, then the public URL. The difference is what Nginx and Cloudflare add."],["Read the right log","`/var/log/nginx/error.log` explains 502 and 504 upstream errors; `pm2 logs` explains the app."]]};

DEEP.p2={title:"One PR gate for develop and main",
  intro:"A single workflow that replaces today’s split between `main-branch-checks.yml` and `repoctx-ci.yml` for the checks that must block a merge.",
  files:[[".github/workflows/pr-checks.yml",`name: PR checks
on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: pr-\${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn tsc:check          # develop PRs skip this today
      - run: yarn test
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-\${{ hashFiles('yarn.lock') }}-\${{ github.sha }}
          restore-keys: next-\${{ hashFiles('yarn.lock') }}-
      - run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=4096`]],
  steps:[["Require the job by name","Branch protection matches the check called `checks`. Rename the job and the rule silently stops matching."],["Cancel stale runs","The concurrency group is keyed on the PR number, so a new push cancels the old run."],["Cache what’s slow","setup-node caches dependencies; `.next/cache` restores the last build for this lockfile."],["Least privilege","`contents: read` means a compromised step can’t push code or create releases."]]};

DEEP.p8={title:"Publish the update feed from CI",
  intro:"A `publish` job for Brain Boost Buddy’s `release.yml` that replaces the manual `npm run publish:r2` step once the mac job is fixed.",
  files:[["release.yml — new job after mac and win",`  publish:
    needs: [mac, win]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true           # mac + win into one folder
      - name: Upload installers, then the feed
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CF_R2_PUBLISH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CF_ACCOUNT_ID }}
        run: |
          put() { npx wrangler r2 object put "bashbopassets/brain-boost-updates/$(basename "$1")" --file "$1" --remote; }
          for f in dist/*.dmg dist/*-mac.zip dist/*.exe dist/*.blockmap; do put "$f"; done
          # feed files last: never announce a version whose files aren't there
          put dist/latest-mac.yml
          put dist/latest.yml
      - name: Verify the live feed
        run: |
          curl -fsS https://images.bashbop.com/brain-boost-updates/latest-mac.yml \\
            | grep -q "version: \${GITHUB_REF_NAME#v}"`]],
  steps:[["Upload the feed files","The mac job uploads only `.dmg` and `-mac.zip` today; add `latest-mac.yml` and blockmaps or there’s nothing to publish."],["Order matters","Installers first, `latest*.yml` last, so no app is told about a file that isn’t there yet."],["Scoped token","An R2-only API token for this bucket — not your personal Cloudflare login."],["Verify from outside","The `curl` sees what parents’ apps see, CDN cache included. Give `latest*.yml` a short cache lifetime."]]};

DEEP.p3={title:"The whole of bashbop on one laptop",
  intro:"A compose file that starts web, API, Postgres and Redis with the same database versions API CI already uses.",
  files:[["docker-compose.yml",`services:
  web:
    build:
      context: ../bashbop-event-web
      args:                                 # needs matching ARG lines in the Dockerfile
        NEXT_PUBLIC_BACKEND_URL: http://localhost:9999
    ports: ['3000:80']                      # the Dockerfile sets PORT=80

volumes:
  pgdata:`]],

DEEP.p4={title:"Build once, promote by sha",
  intro:"A deploy workflow for the web app: one image per release, automatic staging, a human gate for production.",
  files:[[".github/workflows/deploy.yml",`on:
  release:
    types: [published]                      # Release Please publishes this

permissions:
  contents: read
  packages: write                           # push to GHCR
  id-token: write                           # OIDC to your cloud

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: \${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=ghcr.io/bashbop/bashbop-event-web:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: \${{ steps.meta.outputs.tag }}

  staging:
    needs: image
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - run: ./deploy.sh staging "\${{ needs.image.outputs.tag }}"
      # then check out, install and run: yarn test:sanity against staging

  production:
    needs: [image, staging]
    environment: production                 # required reviewer pauses here
    runs-on: ubuntu-latest
    steps:
      - run: ./deploy.sh production "\${{ needs.image.outputs.tag }}"`]],
  steps:[["One image, every environment","The same sha goes to staging then production; nothing is rebuilt in between."],["Watch the trigger","Releases created with the default `GITHUB_TOKEN` don’t start other workflows. Your `release.yml` already accepts `RELEASE_PLEASE_TOKEN` — set it."],["Gate with environments","The production environment’s reviewer is the approval, and its secrets reach only that job."],["`deploy.sh` is your platform","ECS, a VPS running `docker compose pull`, or Fly — whatever your ADR chose. Rollback is the same script with the previous sha."]]};

DEEP.p5={title:"Cloudflare as code, starting with what exists",
  intro:"The first Terraform file for bashbop: one proxied DNS record and the R2 bucket both products already use.",
  files:[["infra/cloudflare/main.tf",`terraform {
  required_providers {
    cloudflare = { source = "cloudflare/cloudflare", version = "~> 5.0" }
  }
  backend "s3" {}                        # R2 speaks S3; pass settings with -backend-config
}

variable "account_id" { type = string }
variable "zone_id"    { type = string }

resource "cloudflare_dns_record" "api" {
  zone_id = var.zone_id
  name    = "api.example.com"
  type    = "A"
  content = "203.0.113.10"               # origin IP
  proxied = true
  ttl     = 1                            # 1 = automatic
}

resource "cloudflare_r2_bucket" "assets" {
  account_id = var.account_id
  name       = "bashbopassets"
}`]],
  steps:[["Import, then plan to zero","`terraform import` each existing record and bucket (ID formats are in the provider docs) until `plan` shows no changes. Only then start editing."],["Pin the provider","v5 renamed resources — `cloudflare_record` became `cloudflare_dns_record`. `~> 5.0` stops a surprise major upgrade."],["State is sensitive","State can hold secrets. Keep it in a private, versioned bucket, never in Git."],["Plan in PRs, apply on merge","Reviewers read the plan output, not just the .tf diff."]]};

DEEP.p6={title:"One trace from checkout to webhook",
  intro:"OpenTelemetry in both apps, so a slow or failed booking shows every hop with its timing.",
  files:[["bashbop-api/src/tracing.ts",`import { NodeSDK } from '@opentelemetry/sdk-node';
import { getNodeAutoInstrumentations } from '@opentelemetry/auto-instrumentations-node';
import { OTLPTraceExporter } from '@opentelemetry/exporter-trace-otlp-http';
import { PrismaInstrumentation } from '@prisma/instrumentation';

const sdk = new NodeSDK({
  serviceName: 'bashbop-api',
  traceExporter: new OTLPTraceExporter(),   // reads OTEL_EXPORTER_OTLP_ENDPOINT
  instrumentations: [
    getNodeAutoInstrumentations(),          // http, express, redis…
    new PrismaInstrumentation(),            // a span per query
  ],
});
sdk.start();

// src/main.ts — must be the very first import
import './tracing';`],["bashbop-event-web/instrumentation.ts",`import { registerOTel } from '@vercel/otel';

export function register() {
  registerOTel({ serviceName: 'bashbop-web' });
}`]],
  steps:[["Load order is everything","Instrumentation patches modules as they load. Import it after Nest and you get no spans."],["One trace, two apps","The web app’s outgoing fetch carries a `traceparent` header; the API continues the same trace."],["Error-budget alerts","99.5% over 30 days is 216 minutes. Page when the last hour burns budget about 14× faster than allowed — not on every error."],["Webhooks are their own SLI","Record provider event time against booking-confirmed time as a histogram."]]};

kind: Deployment
metadata:
  name: bashbop-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: bashbop-web }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never below 2 pods
  template:
    metadata:
      labels: { app: bashbop-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001                     # the Dockerfile's nextjs user
      containers:
        - name: web
          image: ghcr.io/bashbop/bashbop-event-web:<sha>   # bumped by a PR
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /api/health, port: 80 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 80 }
            initialDelaySeconds: 20
            periodSeconds: 10`]],
  steps:[["Readiness isn’t liveness","Readiness takes a pod out of the Service; liveness restarts it. Point liveness at a slow dependency and healthy pods get killed."],["Numeric user","`runAsNonRoot` can only verify a numeric UID, hence `runAsUser: 1001` to match `nextjs`."],["Requests schedule, limits protect","No CPU limit avoids throttling Next.js; the memory limit stops a leak taking down the node."],["Port 80 comes back","Some runtimes refuse port 80 for a non-root user. Your job 4 port decision decides whether this pod starts."]]};

/* ------------------------------------------------------------------ helpers */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function md(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");}
function hl(src){return src.split("\n").map(function(line){var e=esc(line);var m=e.match(/^(\s*)(#|\/\/)(.*)$/);if(m)return m[1]+"<span class=\"c\">"+m[2]+m[3]+"</span>";var i=e.search(/\s(#|\/\/)\s/);return i>=0?e.slice(0,i)+"<span class=\"c\">"+e.slice(i)+"</span>":e;}).join("\n");}
function $(sel,el){return (el||document).querySelector(sel);}
function tid(p,k,i){return p.id+"-"+k+i;}

/* ------------------------------------------------------------------ state */
var LS="bdt-progress-v1", SS="bdt-slide";
var embedded;
try{embedded=JSON.parse(document.getElementById("progress-data").textContent);}catch(e){embedded={};}
embedded=normalise(embedded);
var local=null;
try{local=normalise(JSON.parse(localStorage.getItem(LS)||"null"));}catch(e){local=null;}
var state=embedded, dirty=false;
if(local && local.updatedAt>embedded.updatedAt){state=local;dirty=true;}
function normalise(s){s=s&&typeof s==="object"?s:{};return {v:1,updatedAt:+s.updatedAt||0,started:typeof s.started==="string"?s.started:"",done:s.done&&typeof s.done==="object"?s.done:{},notes:s.notes&&typeof s.notes==="object"?s.notes:{}};}

function phaseStats(p){
  var ids=[];p.tasks.forEach(function(_,i){ids.push(tid(p,"t",i));});p.exit.forEach(function(_,i){ids.push(tid(p,"x",i));});
  var n=ids.filter(function(id){return state.done[id];}).length;
  return {n:n,total:ids.length,status:n===0?"queued":(n===ids.length?"passed":"running")};
}
function totals(){var n=0,t=0,passed=0;PHASES.forEach(function(p){var s=phaseStats(p);n+=s.n;t+=s.total;if(s.status==="passed")passed++;});return {n:n,t:t,passed:passed};}
function targetDate(p){
  if(!state.started)return "";
  var d=new Date(state.started+"T00:00:00");if(isNaN(d))return "";
  d.setDate(d.getDate()+p.weeks[1]*7-1);
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
}
function isLate(p){
  if(!state.started||phaseStats(p).status==="passed")return false;
  var d=new Date(state.started+"T00:00:00");d.setDate(d.getDate()+p.weeks[1]*7);
  return Date.now()>d.getTime();
}

/* ------------------------------------------------------------------ saving */
var artifactNs=null, canPublish=false, saveTimer=null, chipState="local";
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function change(){
  state.updatedAt=Date.now();dirty=true;persistLocal();
  setChip(canPublish?"unsaved":"local");
  scheduleSave(15000);
}
function scheduleSave(ms){
  clearTimeout(saveTimer);
  if(!canPublish)return;
  saveTimer=setTimeout(function(){
    var a=document.activeElement;
    if(a&&a.tagName==="TEXTAREA"){scheduleSave(8000);return;}
    publishNow();
  },ms);
}
function buildDoc(){
  var css=document.getElementById("app-css").textContent;
  var js=document.getElementById("app-js").textContent;
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  var S="scr"+"ipt";
  return "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">"+
    "<title>Bashbop DevOps Track</title>"+
    "<link id=\"fonts\" rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap\">"+
    "<style id=\"app-css\">"+css+"</style></head><body><div id=\"root\"></div>"+
    "<"+S+" type=\"application/json\" id=\"progress-data\">"+json+"</"+S+">"+
    "<"+S+" id=\"app-js\">"+js+"</"+S+"></body></html>";
}
function publishNow(){
  clearTimeout(saveTimer);
  if(!artifactNs||!canPublish||!dirty)return;
  try{sessionStorage.setItem(SS,String(cur));}catch(e){}
  setChip("saving");
  artifactNs.publish(buildDoc()).then(function(){dirty=false;setChip("saved");})
  .catch(function(e){
    var c=e&&e.code;
    if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"){canPublish=false;setChip("local");}
    else if(c==="conflict"){setChip("conflict");}
    else if(c==="rate_limited"){setChip("unsaved");scheduleSave(60000);}
    else{setChip("error");}
  });
}
var CHIP={saved:"Progress saved to page",unsaved:"Unsaved changes",saving:"Saving…",local:"Saved in this browser",conflict:"Newer version loading",error:"Couldn’t save — try again"};
function setChip(s){
  chipState=s;var el=$("#chip");if(!el)return;
  el.setAttribute("data-s",s);
  var btn=(s==="unsaved"||s==="error")&&canPublish?"<button type=\"button\" id=\"savenow\">Save now</button>":"";
  el.innerHTML="<b></b><span>"+CHIP[s]+"</span>"+btn;
  var b=$("#savenow");if(b)b.onclick=publishNow;
  var hs=$("#howsave");if(hs)hs.textContent=CHIP[s];
}

/* ------------------------------------------------------------------ slides */
var HEAD=5, PER=5;
function ps(pi){return HEAD+pi*PER;}
function pidx(id){for(var k=0;k<PHASES.length;k++){if(PHASES[k].id===id)return k;}return 0;}
var SLIDES=[{type:"cover",label:"Run overview"},{type:"howto",label:"How this track works"},{type:"audit",label:"Baseline: both products today"},{type:"arch",which:"bashbop",label:"bashbop architecture"},{type:"arch",which:"bbb",label:"Brain Boost Buddy architecture"}];
PHASES.forEach(function(p,pi){
  SLIDES.push({type:"intro",pi:pi,label:"Why "+p.short.toLowerCase()});
  SLIDES.push({type:"flow",pi:pi,label:p.flowTitle});
  SLIDES.push({type:"deep",pi:pi,label:"Worked example"});
  SLIDES.push({type:"lab",pi:pi,label:"Lab tasks"});
  SLIDES.push({type:"check",pi:pi,label:"Checkpoint"});
});
SLIDES.push({type:"habits",label:"Weekly rhythm"});

function eyebrowFor(p,pi,extra){
  var s=phaseStats(p);
  return "<div class=\"eyebrow\" data-a style=\"--i:0\"><span>job "+(pi+1)+"/"+PHASES.length+" · "+esc(p.short)+" · weeks "+p.weeks[0]+"–"+p.weeks[1]+"</span>"+
    "<span class=\"pill "+s.status+" st\">"+s.status+"</span>"+(isLate(p)?"<span class=\"pill risk st\">behind target</span>":"")+(extra||"")+"</div>";
}

function renderSlide(i){
  var sl=SLIDES[i], h="";
  if(sl.type==="cover"){
    var t=totals(), pct=t.t?Math.round(t.n/t.t*100):0;
    h+="<div class=\"eyebrow\" data-a style=\"--i:0\"><span>pipeline · bashbop + Brain Boost Buddy</span><span>"+(state.started?"started "+esc(new Date(state.started+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})):"not started")+"</span></div>";
    h+="<h1 data-a style=\"--i:1\">Bashbop DevOps Track</h1>";
    h+="<p class=\"lede\" data-a style=\"--i:2\">Nine jobs across bashbop and Brain Boost Buddy — from reading your own server to signed releases, edge Workers, code-defined infrastructure and alerts. Every lab is real work on your repos.</p>";
    h+="<div class=\"two\">";
    h+="<div class=\"run\" data-a style=\"--i:3\">";
    PHASES.forEach(function(p,pi){
      var s=phaseStats(p), td=targetDate(p);
      h+="<button class=\"runrow\" type=\"button\" data-go=\""+ps(pi)+"\"><span class=\"dot "+s.status+"\"></span><span><span class=\"nm\">"+esc(p.title)+"</span><div class=\"meta\">weeks "+p.weeks[0]+"–"+p.weeks[1]+(td?" · due "+esc(td):"")+(isLate(p)?" · behind":"")+"</div><div class=\"bar\"><span style=\"width:"+(s.total?s.n/s.total*100:0)+"%\"></span></div></span><span class=\"right\">"+s.n+"/"+s.total+"</span></button>";
    });
    h+="</div>";
    h+="<div style=\"display:flex;flex-direction:column;gap:22px\">";
    h+="<div class=\"stats\" data-a style=\"--i:4\"><div class=\"stat\"><div class=\"n\">"+pct+"%</div><div class=\"l\">complete</div></div><div class=\"stat\"><div class=\"n\">"+t.n+"<span class=\"muted\" style=\"font-size:22px\">/"+t.t+"</span></div><div class=\"l\">checks ticked</div></div><div class=\"stat\"><div class=\"n\">"+t.passed+"<span class=\"muted\" style=\"font-size:22px\">/"+PHASES.length+"</span></div><div class=\"l\">jobs passed</div></div></div>";
    h+="<div class=\"panel\" data-a style=\"--i:5\"><div class=\"row\" style=\"justify-content:space-between\"><div class=\"field\"><label for=\"start\">Start date</label><input type=\"date\" id=\"start\" value=\""+esc(state.started)+"\"></div><button class=\"btn primary\" type=\"button\" id=\"resume\">"+(t.n?"Resume":"Start job 1")+" →</button></div><p class=\"small muted\" style=\"margin-top:12px\">Set a start date to get a due date per job. At a few hours a week, the full run is about eight months.</p></div>";
    h+="</div></div>";
  }
  else if(sl.type==="howto"){
    h+="<div class=\"eyebrow\" data-a style=\"--i:0\"><span>how this track works</span></div>";
    h+="<h2 data-a style=\"--i:1\">Learn it, study a real example, apply it, prove it.</h2>";
    h+="<div class=\"loop\" data-a style=\"--i:2\"><div><span class=\"k\">1 · learn</span><h3>Concepts & diagram</h3><p class=\"small muted\">The terms you need and a picture of how they fit your products.</p></div><div><span class=\"k\">2 · study</span><h3>Worked example</h3><p class=\"small muted\">Annotated config or code for your stack, with the gotchas called out.</p></div><div><span class=\"k\">3 · apply</span><h3>Lab tasks</h3><p class=\"small muted\">Real changes to bashbop and Brain Boost Buddy. Tick each one when it’s done.</p></div><div><span class=\"k\">4 · prove</span><h3>Checkpoint</h3><p class=\"small muted\">Exit criteria, self-check questions and notes. A job passes when every box is ticked.</p></div></div>";
    h+="<div class=\"two\">";
    h+="<div class=\"panel\" data-a style=\"--i:3\"><h3 style=\"margin-bottom:12px\">Moving around</h3><div class=\"keys\"><span><kbd>→</kbd> <kbd>space</kbd></span><span>Next slide</span><span><kbd>←</kbd></span><span>Previous slide</span><span><kbd>O</kbd></span><span>All slides overview</span><span><kbd>Home</kbd> <kbd>End</kbd></span><span>First / last slide</span><span>Top rail</span><span>Jump to any job; green is passed, amber is in progress</span></div></div>";
    h+="<div class=\"panel\" data-a style=\"--i:4\"><h3 style=\"margin-bottom:12px\">How progress is kept</h3><p class=\"small muted\">"+(window.claude?"Ticks, notes and your start date save into this page as a new version about 15 seconds after you stop — so they follow you to any device. If this view can’t save to the page, they stay in this browser.":"Ticks, notes and your start date save in this browser as you go. Come back in the same browser to pick up where you left off.")+"</p><p class=\"small\" style=\"margin-top:12px\">Right now: <strong id=\"howsave\">"+CHIP[chipState]+"</strong></p></div>";
    h+="</div>";
  }
  else if(sl.type==="audit"){
    h+="<div class=\"eyebrow\" data-a style=\"--i:0\"><span>baseline · read from the repos on 13 Sep 2026</span></div>";
    h+="<h2 data-a style=\"--i:1\">Where both products start</h2>";
    h+="<p class=\"lede\" data-a style=\"--i:2\">These findings are the first lab tasks — you learn each concept by fixing something real.</p>";
    h+="<div class=\"findings\" data-a style=\"--i:3\">";
    FINDINGS.forEach(function(f){var k=pidx(f[3]);h+="<div class=\"finding\"><span class=\"pill "+f[0]+"\">"+(f[0]==="risk"?"risk":f[0]==="warn"?"gap":"tidy")+"</span><span><strong>"+esc(f[1])+"</strong> — "+md(f[2])+"</span><button class=\"fix\" type=\"button\" data-go=\""+(ps(k)+3)+"\">job "+(k+1)+" →</button></div>";});
    h+="</div>";
    h+="<div data-a style=\"--i:4\"><h3 style=\"margin-bottom:10px\">Already in good shape</h3><div class=\"strengths\">"+STRENGTHS.map(function(s){return "<span>"+esc(s)+"</span>";}).join("")+"</div></div>";
  }
  else if(sl.type==="arch"){
    var A=ARCH[sl.which];
    h+="<div class=\"eyebrow\" data-a style=\"--i:0\"><span>architecture · "+esc(A.product)+" · as read on 13 Sep 2026</span></div>";
    h+="<h2 data-a style=\"--i:1\">"+esc(A.title)+"</h2>";
    h+="<figure class=\"arch\" data-a style=\"--i:2\"><div class=\"svgwrap\">"+A.svg()+"</div><figcaption>"+md(A.caption)+"</figcaption></figure>";
    h+="<div data-a style=\"--i:3\"><h3 style=\"margin-bottom:10px\">Where the jobs change this picture</h3><div class=\"jobchips\">"+A.jobs.map(function(j){var k=pidx(j[0]);return "<button type=\"button\" data-go=\""+ps(k)+"\"><b>job "+(k+1)+"</b>"+esc(j[1])+"</button>";}).join("")+"</div></div>";
  }
  else if(sl.type==="habits"){
    var tt=totals();
    h+="<div class=\"eyebrow\" data-a style=\"--i:0\"><span>after the run · "+tt.n+"/"+tt.t+" checks</span></div>";
    h+="<h2 data-a style=\"--i:1\">A weekly rhythm that makes it stick</h2>";
    h+="<div class=\"loop\" data-a style=\"--i:2\"><div><span class=\"k\">mon · 1h</span><h3>Read</h3><p class=\"small muted\">One concept from the current job, plus its docs. Write three lines in the job’s notes.</p></div><div><span class=\"k\">wed · 2h</span><h3>Build</h3><p class=\"small muted\">One lab task as a real PR with full checks green.</p></div><div><span class=\"k\">sat · 1h</span><h3>Break</h3><p class=\"small muted\">Break something on staging on purpose and recover it. Tick the task only once it’s proven.</p></div></div>";
    h+="<div class=\"two\">";
    h+="<div class=\"panel\" data-a style=\"--i:3\"><h3 style=\"margin-bottom:12px\">Rules for the whole run</h3><ul class=\"res\" style=\"gap:10px\"><li>Anything you do twice, automate.</li><li>Every piece of infrastructure gets a README or runbook entry.</li><li>Main being red is information to raise, never something to filter out.</li><li>Practise on staging; production is for things you’ve already rehearsed.</li></ul></div>";
    h+="<div class=\"panel\" data-a style=\"--i:4\"><h3 style=\"margin-bottom:12px\">Where to go next</h3><ul class=\"res\"><li>roadmap.sh/devops — a checklist to find gaps</li><li>KodeKloud labs — timed practice for certifications</li><li>Google SRE Book & Workbook — free at sre.google</li><li>Gene Kim et al. — The Phoenix Project</li></ul></div>";
    h+="</div>";
  }
  else{
    var p=PHASES[sl.pi], pi=sl.pi, s=phaseStats(p);
    if(sl.type==="intro"){
      var td=targetDate(p);
      h+=eyebrowFor(p,pi,td?"<span>due "+esc(td)+"</span>":"");
      h+="<h2 data-a style=\"--i:1\">"+esc(p.title)+"</h2>";
      h+="<p class=\"lede\" data-a style=\"--i:2\">"+md(p.why)+"</p>";
      h+="<div data-a style=\"--i:3\"><h3 style=\"margin-bottom:10px\">Concepts to learn</h3><div class=\"terms\">"+p.terms.map(function(t){return "<div class=\"term\"><b>"+md(t[0])+"</b><span>"+md(t[1])+"</span></div>";}).join("")+"</div></div>";
    }
    else if(sl.type==="flow"){
      h+=eyebrowFor(p,pi);
      h+="<h2 data-a style=\"--i:1\">"+esc(p.flowTitle)+"</h2>";
      h+="<div class=\"flow\" data-a style=\"--i:2\">"+p.flow.map(function(n,k){return (k?"<span class=\"link\" aria-hidden=\"true\"></span>":"")+"<div class=\"node"+(k===p.hot?" hot":"")+"\"><span class=\"tag\">"+esc(n[0])+"</span><span class=\"t\">"+md(n[1])+"</span><span class=\"s\">"+md(n[2])+"</span></div>";}).join("")+"</div>";
      h+="<div class=\"callouts\" data-a style=\"--i:3\">"+p.callouts.map(function(c){return "<div class=\"callout "+(c[0]==="info"?"info":"")+"\">"+md(c[1])+"</div>";}).join("")+"</div>";
    }
    else if(sl.type==="deep"){
      var D=DEEP[p.id];
      h+=eyebrowFor(p,pi,"<span>worked example</span>");
      h+="<h2 data-a style=\"--i:1\">"+esc(D.title)+"</h2>";
      h+="<p class=\"lede\" data-a style=\"--i:2\">"+md(D.intro)+"</p>";
      h+="<div class=\"deep\" data-a style=\"--i:3\"><div class=\"codes\">"+D.files.map(function(f){return "<div><div class=\"codehead\">"+esc(f[0])+"</div><pre class=\"code\"><code>"+hl(f[1])+"</code></pre></div>";}).join("")+"</div><ol class=\"steps\">"+D.steps.map(function(x){return "<li><span><b>"+esc(x[0])+"</b>"+md(x[1])+"</span></li>";}).join("")+"</ol></div>";
    }
    else if(sl.type==="lab"){
      var ln=p.tasks.filter(function(_,k){return state.done[tid(p,"t",k)];}).length;
      h+=eyebrowFor(p,pi);
      h+="<div class=\"labhead\" data-a style=\"--i:1\"><h2>Lab: "+esc(p.short.toLowerCase())+" on bashbop</h2><div class=\"count\" id=\"labcount\">"+ln+"<small>/ "+p.tasks.length+" tasks</small></div></div>";
      h+="<ul class=\"tasks\" data-a style=\"--i:2\">"+p.tasks.map(function(t,k){var id=tid(p,"t",k),on=!!state.done[id];return "<li class=\"task"+(on?" done":"")+"\"><label><input type=\"checkbox\" class=\"settled\" data-task=\""+id+"\""+(on?" checked":"")+"><span class=\"tx\"><span class=\"main\">"+md(t[0])+"</span>"+(t[1]?"<span class=\"why\">"+md(t[1])+"</span>":"")+"</span></label></li>";}).join("")+"</ul>";
    }
    else if(sl.type==="check"){
      h+=eyebrowFor(p,pi);
      h+="<h2 data-a style=\"--i:1\">Checkpoint: is job "+(pi+1)+" green?</h2>";
      h+="<div class=\"two\">";
      h+="<div style=\"display:flex;flex-direction:column;gap:22px\">";
      h+="<div data-a style=\"--i:2\"><h3 style=\"margin-bottom:10px\">Exit criteria</h3><ul class=\"tasks\">"+p.exit.map(function(t,k){var id=tid(p,"x",k),on=!!state.done[id];return "<li class=\"task"+(on?" done":"")+"\"><label><input type=\"checkbox\" class=\"settled\" data-task=\""+id+"\""+(on?" checked":"")+"><span class=\"tx\"><span class=\"main\">"+md(t)+"</span></span></label></li>";}).join("")+"</ul></div>";
      h+="<div class=\"panel\" data-a style=\"--i:3\"><h3 style=\"margin-bottom:12px\">Self-check</h3>"+p.quiz.map(function(q){return "<details class=\"q\"><summary>"+md(q[0])+"</summary><p>"+md(q[1])+"</p></details>";}).join("")+"</div>";
      h+="</div>";
      h+="<div style=\"display:flex;flex-direction:column;gap:22px\">";
      h+="<div data-a style=\"--i:4\"><div class=\"field\"><label for=\"notes-"+p.id+"\">Notes for job "+(pi+1)+"</label><textarea id=\"notes-"+p.id+"\" data-notes=\""+p.id+"\" placeholder=\"What surprised you, commands worth keeping, links to PRs…\">"+esc(state.notes[p.id]||"")+"</textarea></div></div>";
      h+="<div class=\"panel\" data-a style=\"--i:5\"><h3 style=\"margin-bottom:12px\">Resources</h3><ul class=\"res\">"+p.res.map(function(r){return "<li>"+md(r)+"</li>";}).join("")+"</ul></div>";
      h+="</div></div>";
    }
  }
  return "<div class=\"inner\">"+h+"</div>";
}

/* ------------------------------------------------------------------ shell */
var cur=0;
function initialSlide(){
  var n=NaN;
  try{var ss=sessionStorage.getItem(SS);if(ss!==null){n=parseInt(ss,10);sessionStorage.removeItem(SS);}}catch(e){}
  if(isNaN(n)){var m=location.hash.match(/^#s-(\d+)$/);if(m)n=parseInt(m[1],10)-1;}
  return isNaN(n)?0:Math.max(0,Math.min(SLIDES.length-1,n));
}

document.getElementById("root").innerHTML=
  "<div class=\"app\">"+
   "<header class=\"top\"><div class=\"brand\"><i></i>DevOps Track</div><nav class=\"rail\" id=\"rail\" aria-label=\"Jobs\"></nav><div class=\"chip\" id=\"chip\" role=\"status\"></div></header>"+
   "<main class=\"stage\" id=\"stage\"></main>"+
   "<footer class=\"bottom\"><div class=\"nav\"><button type=\"button\" id=\"prev\" aria-label=\"Previous slide\">←</button><button type=\"button\" id=\"next\" aria-label=\"Next slide\">→</button></div><div class=\"where\"><span class=\"lbl\" id=\"lbl\"></span><div class=\"track\"><span id=\"track\"></span></div></div><button class=\"ovbtn\" type=\"button\" id=\"ovbtn\">All slides <kbd>O</kbd></button></footer>"+
  "</div><div class=\"overview\" id=\"overview\" hidden></div>";

function renderRail(){
  var r="";
  PHASES.forEach(function(p,pi){
    var s=phaseStats(p), here=SLIDES[cur].pi===pi;
    if(pi)r+="<span class=\"wire"+(phaseStats(PHASES[pi-1]).status==="passed"?" lit":"")+"\"></span>";
    r+="<button type=\"button\" class=\"job"+(here?" here":"")+"\" data-go=\""+ps(pi)+"\" title=\""+esc(p.title)+" — "+s.n+"/"+s.total+"\"><span class=\"dot "+s.status+"\"></span><span class=\"jl\">"+esc(p.short)+"</span></button>";
  });
  $("#rail").innerHTML=r;
}
function renderChrome(){
  var sl=SLIDES[cur];
  var ctx=sl.pi!=null?"Job "+(sl.pi+1)+" · "+PHASES[sl.pi].short+" — "+sl.label:sl.label;
  $("#lbl").textContent=(cur+1)+" / "+SLIDES.length+"  ·  "+ctx;
  $("#track").style.width=((cur+1)/SLIDES.length*100)+"%";
  $("#prev").disabled=cur===0;$("#next").disabled=cur===SLIDES.length-1;
  renderRail();
}
function show(i,dir,animate){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  var stage=$("#stage");
  var el=document.createElement("section");
  el.className="slide"+(animate?" animate "+(dir<0?"in-prev":"in-next"):"");
  el.setAttribute("aria-label",SLIDES[i].label);
  cur=i;
  el.innerHTML=renderSlide(i);
  stage.innerHTML="";stage.appendChild(el);
  try{history.replaceState(null,"","#s-"+(i+1));}catch(e){}
  renderChrome();
}
function go(i){if(i===cur)return;show(i,i>cur?1:-1,true);closeOverview();}

function openOverview(){
  var o=$("#overview"),h="<div class=\"ovgrid\"><div class=\"row\" style=\"justify-content:space-between\"><h2>All slides</h2><button class=\"btn\" type=\"button\" id=\"ovclose\">Close <kbd>Esc</kbd></button></div>";
  var groups=[{name:"Start",idx:[0,1,2,3,4]}];
  PHASES.forEach(function(p,pi){var b=ps(pi);groups.push({name:"Job "+(pi+1)+" · "+p.title,pi:pi,idx:[b,b+1,b+2,b+3,b+4]});});
  groups.push({name:"Finish",idx:[SLIDES.length-1]});
  groups.forEach(function(g){
    h+="<div class=\"ovgroup\"><h3>"+(g.pi!=null?"<span class=\"dot "+phaseStats(PHASES[g.pi]).status+"\"></span>":"")+esc(g.name)+"</h3><div class=\"ovcards\">"+g.idx.map(function(k){return "<button type=\"button\" class=\"ovcard"+(k===cur?" cur":"")+"\" data-go=\""+k+"\"><span>"+(k+1)+"</span>"+esc(SLIDES[k].label)+"</button>";}).join("")+"</div></div>";
  });
  o.innerHTML=h+"</div>";o.hidden=false;
  var c=o.querySelector(".ovcard.cur");if(c)c.focus();
}
function closeOverview(){var o=$("#overview");if(!o.hidden){o.hidden=true;o.innerHTML="";}}

/* ------------------------------------------------------------------ events */
document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");
  if(g){go(parseInt(g.getAttribute("data-go"),10));return;}
  if(e.target.closest("#prev"))go(cur-1);
  else if(e.target.closest("#next"))go(cur+1);
  else if(e.target.closest("#ovbtn"))openOverview();
  else if(e.target.closest("#ovclose"))closeOverview();
  else if(e.target.closest("#resume")){
    var target=PHASES.findIndex(function(p){return phaseStats(p).status!=="passed";});
    if(target<0)target=PHASES.length-1;
    go(ps(target)+(phaseStats(PHASES[target]).n?3:0));
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.matches("input[data-task]")){
    t.classList.remove("settled");
    var id=t.getAttribute("data-task");
    if(t.checked)state.done[id]=true;else delete state.done[id];
    var li=t.closest(".task");if(li)li.classList.toggle("done",t.checked);
    var sl=SLIDES[cur];
    if(sl.type==="lab"){var p=PHASES[sl.pi];var n=p.tasks.filter(function(_,k){return state.done[tid(p,"t",k)];}).length;var lc=$("#labcount");if(lc)lc.innerHTML=n+"<small>/ "+p.tasks.length+" tasks</small>";}
    var eb=document.querySelector(".slide .eyebrow .st");
    if(eb&&sl.pi!=null){var st=phaseStats(PHASES[sl.pi]).status;eb.className="pill "+st+" st";eb.textContent=st;}
    renderRail();change();
  } else if(t.id==="start"){
    state.started=t.value||"";change();show(cur,0,false);
  }
});
var noteTimer;
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.matches("textarea[data-notes]")){
    state.notes[t.getAttribute("data-notes")]=t.value;
    clearTimeout(noteTimer);noteTimer=setTimeout(change,600);
  }
});
document.addEventListener("focusout",function(e){
  if(e.target.matches&&e.target.matches("textarea[data-notes]")&&dirty&&canPublish)scheduleSave(4000);
});
document.addEventListener("keydown",function(e){
  var tag=(e.target.tagName||"");
  if(tag==="TEXTAREA"||tag==="INPUT"){return;}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var ov=!$("#overview").hidden;
  if(e.key==="Escape"&&ov){closeOverview();return;}
  if(e.key==="o"||e.key==="O"){ov?closeOverview():openOverview();e.preventDefault();return;}
  if(ov)return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||(e.key===" "&&tag!=="BUTTON"&&tag!=="SUMMARY")){go(cur+1);e.preventDefault();}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){go(cur-1);e.preventDefault();}
  else if(e.key==="Home"){go(0);e.preventDefault();}
  else if(e.key==="End"){go(SLIDES.length-1);e.preventDefault();}
});
var tx=null;
document.addEventListener("touchstart",function(e){if(e.touches.length===1)tx=[e.touches[0].clientX,e.touches[0].clientY];},{passive:true});
document.addEventListener("touchend",function(e){
  if(!tx)return;var dx=e.changedTouches[0].clientX-tx[0],dy=e.changedTouches[0].clientY-tx[1];tx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1));
},{passive:true});
window.addEventListener("beforeunload",function(){persistLocal();});

/* ------------------------------------------------------------------ boot */
show(initialSlide(),0,false);
setChip(dirty?"local":"local");
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("artifact").then(function(ns){
    if(!ns){setChip("local");return;}
    artifactNs=ns;canPublish=true;
    setChip(dirty?"unsaved":"saved");
  }).catch(function(){setChip("local");});
}
})();
</script>
</body>
</html>
