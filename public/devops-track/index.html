/* break-fix drills per job */
var DRILL_CHECKS=["I broke it on staging and recovered before revealing the answer","The prevention change is merged"];
var DRILL={
  p1:{title:"The API is gone after a reboot",
    setup:"On a staging copy of the Coolify host, run `docker update --restart=no <api-container>`, then `sudo reboot`. Better still, have someone else do it so you don’t know what changed.",
    symptoms:["The API hostname returns an error page instead of JSON.","The web app loads, but every data call fails.","SSH works and `top` looks healthy."],
    hints:["Whose error is it, Cloudflare’s or Traefik’s? Check the error page and `curl -sI https://<api-domain>/ | grep -i server`.","On the host: `docker ps -a`. Is the API container there, and what’s its status?","`docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' <api-container>`. What starts a container after the Docker daemon restarts?","Traefik builds routes from running containers’ labels. What happens to the API’s route while its container is stopped?"],
    cause:"The API container’s restart policy was `no`, so Docker didn’t start it after the reboot, and with the container stopped Traefik dropped the route built from its labels. The proxy was healthy; the thing behind it wasn’t running.",
    fix:"Redeploy the API from Coolify, which recreates the container with its configured restart policy (or run `docker update --restart=unless-stopped` and start it), then confirm `/api/v1/health` returns 200 through the public URL.",
    prevent:"An external uptime check on `/api/v1/health` that pages you, a reboot test after any host change, and, in {job:p5}, the host’s configuration in code so a hand edit shows up as drift."},
  p2:{title:"Green checks, broken types",
    setup:"On a branch from `develop`, add `const n: number = 'oops';` to a component used by one page, and open a PR into `develop`.",
    symptoms:["Every check on the PR is green.","It merges, and `yarn build` still succeeds.","Weeks later a PR into `main` fails ‘Type check’ on code it didn’t touch."],
    hints:["List what actually ran: `gh pr checks <number>`. Does any check run `tsc`?","Open `.github/workflows/main-branch-checks.yml`. Which branches trigger it?","Why didn’t `next build` in `otito-ci.yml` fail? Search `next.config.mjs` for `typescript`."],
    cause:"Type checking only runs on PRs into `main`, and `next.config.mjs` sets `typescript.ignoreBuildErrors: true`, so the build ignores type errors too. Nothing on a `develop` PR could catch it.",
    fix:"Fix the error, add the PR gate from this job’s worked example on both branches, and make `checks` a required status check.",
    prevent:"A ruleset requiring `checks` on `develop` and `main`, a deliberate test PR proving a type error blocks merging, and removing `ignoreBuildErrors` once the backlog is clean."},
  p8:{title:"The Mac release that can’t unlock its keychain",open:true,
    setup:"No setup, this one is live. Every tag since v2.4.0 fails in ‘Build, sign and notarise’. Investigate on a branch with `workflow_dispatch`; never push a real tag to test.",
    symptoms:["`verify` and `win` pass; `macOS (signed + notarised)` fails after about four minutes.","The log ends with `security set-key-partition-list … SecKeychainUnlock: The user name or passphrase you entered is not correct`.","v2.3.1 on 8 Aug 2026 was the last green release run."],
    hints:["Did v2.3.1 sign at all? Search its mac log for ‘No CSC_LINK secret set’. If it built unsigned, CI signing may never have worked.","Compare the runner image version at the top of the v2.3.1 and v2.4.0 mac logs, and `electron-builder` in `package-lock.json` between the two tags.","Test the secret offline: decode `CSC_LINK` to a file and run `openssl pkcs12 -in cert.p12 -noout` with the password (add `-legacy` on OpenSSL 3 for older exports).","Create a throwaway keychain with `security create-keychain -p drill drill.keychain`, then `security import cert.p12 -k drill.keychain -P \"$PW\" -T /usr/bin/codesign`. Does the import succeed?","Isolate the runner: run the same job on an older macOS image that is still offered. If it passes, the image change is your cause."],
    cause:"Open, finding it is the drill. The error comes from electron-builder’s temporary-keychain step, so the leading suspects are a runner image change, an electron-builder change, or a certificate and password pair that won’t import. Each hint confirms or rules one out.",
    fix:"Act on the evidence: pin the runner image, pin or upgrade electron-builder, or re-export the Developer ID certificate and replace `CSC_LINK` and `CSC_KEY_PASSWORD` together.",
    prevent:"A signing smoke run on `workflow_dispatch` every month and on every electron-builder bump, so signing breaks on a quiet day instead of on release day."},
  p3:{title:"The image that calls the wrong API",
    setup:"Build the web image with no build args: `docker build -t web:drill .`. Run it with `docker run -p 3000:80 -e NEXT_PUBLIC_BACKEND_URL=https://<staging-api> web:drill`.",
    symptoms:["Pages render, but every data request fails.","The browser’s Network tab shows requests to a build-time URL, `localhost` or an empty base, not staging.","`docker exec` shows `NEXT_PUBLIC_BACKEND_URL` is set correctly inside the container."],
    hints:["Where does a `NEXT_PUBLIC_` value live after `next build`? `docker run --rm web:drill sh -c \"grep -rl localhost .next/static | head\"`.","Did a `.env` or `.env.local` file get copied into the build? Check for a `.dockerignore`.","Can an environment variable set at `docker run` change JavaScript files that were generated during the build?"],
    cause:"`NEXT_PUBLIC_*` values are replaced with literal strings in the browser bundle during `next build`. The image holds whatever existed at build time, possibly a local `.env` copied into the build context. Runtime variables never reach code already in the bundle.",
    fix:"Pass the value as a build arg (`ARG` + `ENV` before `yarn build`) for each environment, or serve configuration at runtime so one image can promote from staging to production.",
    prevent:"`.env*` in `.dockerignore`, plus a CI step that greps the built bundle for `localhost` and fails the build."},
  p10:{title:"The API can’t reach its database",
    setup:"In the sandbox VPC from the lab, delete the database security group’s inbound rule for port 5432 from the app’s security group, then restart the API task.",
    symptoms:["The task starts, then logs `P1001: Can't reach database server` and fails health checks.","The load balancer marks targets unhealthy and returns 503.","The database shows as available in the console."],
    hints:["Timeout or refused? Refused means a host answered; a timeout means packets were dropped on the way.","From inside the task (ECS Exec) run `nc -vz <db-endpoint> 5432`. What happens?","Check in order: the database security group’s inbound rules, the subnets’ network ACLs, the route tables. Which changed?","Run VPC Reachability Analyzer from the task’s network interface to the database."],
    cause:"The database security group no longer allowed 5432 from the app’s group. Security groups silently drop disallowed traffic, so the client saw a timeout rather than a refusal.",
    fix:"Restore the inbound rule with the app’s security group as the source, not a CIDR, never `0.0.0.0/0`, and confirm with `nc -vz` before restarting tasks.",
    prevent:"Security groups defined in Terraform so manual edits show up as drift, and a health check that includes a database ping."},
  p4:{title:"Deploy succeeded, then ‘column does not exist’",
    setup:"On staging, rename a harmless field in `schema.prisma`, generate the migration, update the code and ship it all in one release with a rolling deploy.",
    symptoms:["The pipeline is green.","During the rollout errors spike: `P2022: The column … does not exist in the current database`.","Rolling back makes it worse, the old version now fails on every query touching that table."],
    hints:["Which version logs the errors? Put the image sha or version on every log line.","Line up the migration step’s timestamp with the first error.","Read the generated SQL in `prisma/migrations/`. Did Prisma rename the column, or drop it and add a new one?"],
    cause:"The migration removed the old column while the old version was still serving traffic. Prisma turns a field rename into drop-and-add by default, so that column’s data was lost too.",
    fix:"Roll forward: restore the old column in a new migration (recovering its data from backup), then redo the change as expand–contract over several releases.",
    prevent:"Fail `migration-check.yml` on `DROP COLUMN`, renames and type changes unless the PR is labelled as a contract step, and lint migrations with a tool such as Squawk."},
  p9:{title:"Staging says everyone is offline",
    setup:"Add the `[env.staging]` block from this job’s worked example and run `wrangler deploy --env staging`, but don’t set any secrets for staging.",
    symptoms:["Every `/start` and `/status` call to staging returns `{ ok: false, reason: \"offline\" }` with HTTP 502.","Production is unaffected.","`wrangler deploy` reported success."],
    hints:["Watch live logs while you send a request: `wrangler tail --env staging`.","Compare `wrangler secret list` with `wrangler secret list --env staging`.","Find where `worker.js` returns `offline` before it ever calls Lemon Squeezy."],
    cause:"Secrets don’t carry over into Wrangler environments. With no `LS_API_KEY` in staging, the Worker logs ‘LS_API_KEY secret not set’ and answers `offline` (502) to every request.",
    fix:"`wrangler secret put LS_API_KEY --env staging` with a Lemon Squeezy test-mode key, then call `/status` with a test email.",
    prevent:"A post-deploy smoke step that calls `/status` and fails the pipeline on `offline`, and a checklist of per-environment secrets kept next to `wrangler.toml`."},
  p5:{title:"The plan wants to destroy production DNS",
    setup:"In a sandbox zone managed by Terraform, rename `resource \"cloudflare_dns_record\" \"api\"` to `\"api_origin\"` and run `terraform plan`.",
    symptoms:["The plan destroys `cloudflare_dns_record.api` and creates `cloudflare_dns_record.api_origin`.","‘Plan: 1 to add, 0 to change, 1 to destroy.’","Nothing about the record itself changed."],
    hints:["How does Terraform know which real record a block manages? Run `terraform state list`.","Is a resource identified by its content or by its address?","Look up the `moved` block in the Terraform documentation."],
    cause:"State maps resource addresses to real IDs. Renaming the block changed the address, so Terraform saw a new resource and an orphaned old one, a delete and a create, briefly breaking DNS.",
    fix:"Add a `moved` block from `cloudflare_dns_record.api` to `cloudflare_dns_record.api_origin` and re-plan until it shows no changes.",
    prevent:"`lifecycle { prevent_destroy = true }` on critical records, and a CI check that fails when a plan contains deletes without an approval label."},
  p11:{title:"A secret in history",
    setup:"Create a real token with no permissions for this drill (for example a Cloudflare API token scoped to nothing). In a throwaway private repo, commit it, push, then remove it in a second commit.",
    symptoms:["The latest commit no longer contains the token.","If push protection or secret scanning is on you get an alert; if not, nothing happens at all.","`git log -p` still shows it."],
    hints:["Scan all history, not just the working tree: `gitleaks git --log-opts=\"--all\" -v`.","Who could already have a copy? Forks, clones, CI logs and caches all count.","What does the provider’s audit log show for that token?","Now run the same scan on bashbop-event-web, bashbop-api and brain-boost."],
    cause:"Removing a secret in a later commit doesn’t remove it from history, and anyone who had read access may already have it. The only safe assumption is that it’s compromised.",
    fix:"Revoke or rotate the credential first, check the provider’s audit log for use, then clean history with `git filter-repo` if you must, as hygiene, not as the fix.",
    prevent:"Push protection where your plan has it, gitleaks as a pre-commit hook and a required CI check, `.env*` in `.gitignore`, and secrets only in a secrets manager or Worker secrets."},
  p6:{title:"Payments succeed, bookings stay pending",
    setup:"On staging, set `STRIPE_WEBHOOK_SECRET` to a different `whsec_…` value and restart the API. Make a test-mode booking with card 4242 4242 4242 4242.",
    symptoms:["Stripe shows the payment as succeeded.","The booking stays pending and the guest gets no confirmation.","Uptime checks are green and the API hasn’t crashed."],
    hints:["Start at the provider: in the Stripe Dashboard open your webhook endpoint’s recent deliveries. What did your API return?","Search API logs for the webhook route at the payment time. Is signature verification failing?","`src/main.ts` configures body parsing manually for webhook routes. Why does verification need the raw body?"],
    cause:"Stripe signs every webhook with the endpoint’s secret. With the wrong `STRIPE_WEBHOOK_SECRET`, verification fails, the API rejects each event with a 4xx, and nothing confirms bookings, while every health check stays green.",
    fix:"Restore the correct secret, resend the failed events from the Stripe Dashboard (or `stripe events resend <event_id>`), and confirm the stuck bookings move to confirmed.",
    prevent:"Alerts on webhook 4xx rate and on the webhook-lag SLI, a synthetic test-mode booking on staging after each deploy, and replay steps in the ‘Payments failing’ runbook."},
  p7:{title:"DELETE without WHERE at 14:32",
    setup:"On a staging database with point-in-time recovery enabled, note the exact time, then delete a meaningful set of rows, for example every booking for one test event.",
    symptoms:["The organiser dashboard shows the event with no bookings.","No application errors, queries succeed and return nothing.","‘Guests’ report missing tickets."],
    hints:["When exactly did it happen? Check the API’s audit tables (`src/audit`) and Postgres logs if they record writes.","What’s the latest point you can restore to without losing good writes made afterwards?","Restore into a new instance at one minute before the delete. How long did that take? That’s your real RTO."],
    cause:"A manual write ran against the database with a missing or wrong condition. The application was healthy; the data wasn’t, which is why no uptime check noticed.",
    fix:"Restore to a new instance just before the delete, export the lost rows, and insert them into the live database in a reviewed transaction. Never restore over production.",
    prevent:"No direct production writes: read-only roles for investigation, reviewed runbooks for fixes, `BEGIN … ROLLBACK` rehearsals, and a monthly restore drill with measured RPO and RTO."},
  p12:{title:"The game day itself",
    setup:"Your facilitator injects the three faults from the plan at unannounced times inside the time box. You work only from alerts, dashboards and runbooks.",
    symptoms:["Whatever your alerts show, that’s the test.","Expect at least one fault to be noticed late, or not at all."],
    hints:["Declare an incident as soon as an alert fires and name a commander, even if it’s you.","Post the first status update within 10 minutes, then every 15.","Mitigate first; find the cause second.","Write timestamps in the incident channel as you go."],
    cause:"Revealed by the facilitator afterwards, compare their fault log with your timeline, minute by minute.",
    fix:"Mitigate each fault, return staging to known-good, and confirm every undo in the plan actually ran.",
    prevent:"The postmortems and action items. Anything detected late gets a new alert or synthetic check before the next game day."}
};

DRILL.p13={title:"The node drain that takes the site down",
  setup:"On the staging cluster, scale web to one replica, delete its PodDisruptionBudget and readiness probe, start a load test, then run `kubectl drain <node> --ignore-daemonsets --delete-emptydir-data` on the node running it.",
  symptoms:["The load test shows a burst of 502 and 503 responses lasting tens of seconds.","`kubectl get pods` shows the old pod Terminating while the new one is still starting.","The drain command reported success."],
  hints:["How many web pods were serving at the moment of eviction? Watch `kubectl get pods -o wide -w` during the drain.","What would have made the drain wait? `kubectl get pdb -A`.","When did the new pod start receiving traffic, when its container started, or when it was ready? Watch `kubectl get endpointslices -w`."],
  cause:"With one replica and no PDB, the eviction removed the only pod straight away. With no readiness probe, the replacement joined the Service before Next.js could serve, so requests failed until it warmed up.",
  fix:"Run at least two replicas, add a PDB with `minAvailable: 1`, add a readiness probe on the health route, and a short `preStop` sleep so the load balancer deregisters pods before they stop.",
  prevent:"A policy check (for example Kyverno, or a CI lint) that rejects production Deployments with fewer than two replicas, no PDB or no readiness probe, and a drain in every upgrade rehearsal."};
DRILL.p14={title:"The playbook that takes Nginx down",
  setup:"Change the Nginx config task to `shell: cp files/api.conf /etc/nginx/sites-enabled/api.conf` with `notify: restart nginx`, and make that handler `state: restarted`. Run the play three times, then put a typo in `files/api.conf` and run it again.",
  symptoms:["Every run reports `changed=1` for the config task, even with no edits.","Nginx restarts on every run, dropping open connections.","After the typo, the play fails in the handler, and the site is down."],
  hints:["Run with `--check --diff`. What does Ansible think it would change?","How could a `shell` task possibly know whether the file already matches?","What does `nginx -t` do, and where could it run before anything restarts?"],
  cause:"`shell` can’t compare state, so it always reports changed and always notifies the handler. The handler restarted Nginx, stop, then start, and a config that fails validation means the start never happens.",
  fix:"Use `ansible.builtin.template`, run `nginx -t` with `changed_when: false` before handlers flush, and make the handler `state: reloaded` so an invalid config never replaces a working one.",
  prevent:"`ansible-lint` in CI (it flags commands that should be modules), a second-run idempotency check in Molecule, and reloads rather than restarts for config changes."};
DRILL.p15={title:"The mock exam that says you’re not ready",
  checks:["I sat a full timed practice exam and analysed every wrong answer","My weakest domain has a dated study plan"],
  setup:"Take a full-length practice exam under real conditions: timed, one sitting, no notes, no second screen, phone in another room.",
  symptoms:["You run out of time, or finish with no time to review.","Your score is under 80%.","Several wrong answers were on topics you felt you knew."],
  hints:["Sort wrong answers by exam domain. Is one domain most of the loss?","For each wrong answer, which constraint did you miss, ‘most cost-effective’, ‘least operational overhead’, ‘without downtime’?","Where did time go? Mark questions that took more than twice the average."],
  cause:"Lost marks usually come from three places: one weak domain, misreading the constraint the question optimises for, and pacing. Pure knowledge gaps are often the smallest of the three.",
  fix:"Study the weakest domain with hands-on labs, underline the optimisation constraint in every practice question, and set time checkpoints (a third of the questions by a third of the time).",
  prevent:"A mistakes log reviewed daily, and a rule of two consecutive timed runs at 80% or better before the real exam."};
DRILL.p16={title:"The recorded mock you’d fail",
  checks:["I did a recorded mock interview and reviewed the recording","I redid my weakest answer and practised it aloud"],
  setup:"Ask a peer to prepare a broken environment or scenario you haven’t seen, for example the webhook drill from {job:p6} on their own staging. Record 30 minutes on video while you share your screen and think aloud.",
  symptoms:["Long silences while you read logs.","You jump to a fix before saying what you think is wrong.","You find the problem but run out of time to cover prevention."],
  hints:["Watch the recording at 1.5× speed and count the silent minutes.","Mark every moment you acted without first stating a hypothesis.","Did you ask about impact and recent changes in the first two minutes?"],
  cause:"Most failed troubleshooting rounds are communication failures. The interviewer can’t score reasoning they can’t hear, and jumping to fixes looks like guessing even when it works.",
  fix:"Redo the same scenario with the clarify → hypothesise → test → narrow → prevent loop, narrating each step in one sentence.",
  prevent:"One recorded mock a week until silences stay under 30 seconds and every action follows a stated hypothesis."};

var DEEP={};
DEEP.p1={verify:"Checked: the script passes `bash -n` and the Traefik file parses as YAML. It’s an example: Coolify builds the API’s real routes from container labels, so compare it with `docker inspect` and the files already in `/data/coolify/proxy/dynamic/`.",title:"Read the proxy in front of your API",
  intro:"An annotated Traefik route for an API behind Cloudflare, in the file format Coolify’s proxy reads from `/data/coolify/proxy/dynamic/`. Compare it with the labels Coolify put on your API container.",
  files:[["/data/coolify/proxy/dynamic/api-example.yaml (example)",`http:
  routers:
    api:
      rule: "Host(\`api.example.com\`)"          # your API hostname
      entryPoints: [https]                     # Coolify's entry points are http and https
      service: api
      tls: {}                                  # uses the default certificate below
  services:
    api:
      loadBalancer:
        servers:
          - url: "http://<api-container>:9999"  # container name, on the coolify network
        healthCheck:
          path: /api/v1/health                 # stop routing to a dead container
          interval: 10s

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /traefik/certs/cf-origin.pem  # Cloudflare Origin CA cert, in /data/coolify/proxy/certs
        keyFile: /traefik/certs/cf-origin.key   # makes Full (strict) possible`],["scripts/ops/check-stack.sh",`#!/usr/bin/env bash
# Exit non-zero if any public surface is down. Run by hand, from cron or a systemd timer.
set -euo pipefail

check() {
  local name=$1 url=$2
  if curl -fsS --max-time 10 --retry 2 -o /dev/null "$url"; then
    printf 'ok    %s\n' "$name"
  else
    printf 'FAIL  %s  %s\n' "$name" "$url" >&2
    return 1
  fi
}

failed=0
check web  "https://\${WEB_HOST:?set WEB_HOST}/"                              || failed=1
check api  "https://\${API_HOST:?set API_HOST}/api/v1/health"                 || failed=1

DEEP.p2={verify:"Checked: the YAML parses. Adapt: branch protection must require the job name `checks`.",title:"One PR gate for develop and main",
  intro:"A single workflow that replaces today’s split between `main-branch-checks.yml` and `otito-ci.yml` for the checks that must block a merge.",
  files:[[".github/workflows/pr-checks.yml",`name: PR checks
on:
  pull_request:
    branches: [develop, main]

  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn tsc:check          # develop PRs skip this today
      - run: yarn test
      - uses: actions/cache@v4

DEEP.p8={verify:"Checked: the YAML parses. Adapt: first add `latest-mac.yml` and the blockmaps to the mac job’s uploads, and create the `CF_R2_PUBLISH_TOKEN` and `CF_ACCOUNT_ID` secrets.",title:"Publish the update feed from CI",

DEEP.p4={verify:"Checked: both files parse as YAML. Adapt: `deploy.sh` is yours to write for the platform your ADR picks; set `RELEASE_PLEASE_TOKEN` so releases trigger the first one.",title:"Build once, promote by sha",
  intro:"Two workflows for the web app: one image per release, deployed straight to staging, and a promotion a person runs to send that same image to production.",
  files:[[".github/workflows/deploy.yml",`on:
  release:
    types: [published]                      # Release Please publishes this

permissions:
  contents: read
  packages: write                           # push to GHCR
  id-token: write                           # OIDC to your cloud

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: \${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: meta
        run: echo "tag=ghcr.io/bashbop/bashbop-event-web:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: \${{ steps.meta.outputs.tag }}

  staging:
    needs: image
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6          # fresh runner: deploy.sh isn't here yet
      - run: ./deploy.sh staging "\${{ needs.image.outputs.tag }}"
      # then install and run: yarn test:sanity against staging
      # green? run "Promote to production" with this tag`],[".github/workflows/promote.yml",`name: Promote to production
on:

permissions:

  steps:[["One image, every environment","The same sha goes to staging then production; nothing is rebuilt in between."],["Watch the trigger","Releases created with the default `GITHUB_TOKEN` don’t start other workflows. Your `release.yml` already accepts `RELEASE_PLEASE_TOKEN`, set it."],["Gate with a promotion","Private repos on GitHub Team can’t use required reviewers, so production is a separate workflow a person runs with the tag that passed staging. The environment’s branch rule and secrets still apply."],["`deploy.sh` is your platform","ECS, a VPS running `docker compose pull`, Fly, or Coolify’s deploy API, whatever your ADR chose. Rollback is the promotion workflow run with the previous tag."]]};

DEEP.p7={verify:"Checked: the YAML parses. Adapt: add a web `/api/health` route first, only the API has one today, at `/api/v1/health`.",title:"A Deployment that survives a bad pod",
  intro:"The web app on Kubernetes with rolling updates, probes and a non-root user that matches the Dockerfile.",
  files:[["k8s/web/deployment.yaml",`apiVersion: apps/v1
kind: Deployment
metadata:
  name: bashbop-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: bashbop-web }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never below 2 pods
  template:
    metadata:
      labels: { app: bashbop-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001                     # the Dockerfile's nextjs user
      containers:
        - name: web
          image: ghcr.io/bashbop/bashbop-event-web:<sha>   # bumped by a PR
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /api/health, port: 80 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 80 }
            initialDelaySeconds: 20
            periodSeconds: 10`]],
  steps:[["Readiness isn’t liveness","Readiness takes a pod out of the Service; liveness restarts it. Point liveness at a slow dependency and healthy pods get killed."],["Numeric user","`runAsNonRoot` can only verify a numeric UID, hence `runAsUser: 1001` to match `nextjs`."],["Requests schedule, limits protect","No CPU limit avoids throttling Next.js; the memory limit stops a leak taking down the node."],["Port 80 comes back","Some runtimes refuse port 80 for a non-root user. Your {job:p3} port decision decides whether this pod starts."]]};

DEEP.p10={verify:"Checked: the JSON and YAML parse. Adapt: create the OIDC identity provider once, and replace `<account-id>` and the role name.",title:"CI that deploys to AWS without a stored key",
  intro:"Create the GitHub OIDC identity provider in IAM once. Then a role that trusts only your repo’s production environment, and a job that assumes it.",
  files:[["iam/github-deploy-trust-policy.json",`{
  "Version": "2012-10-17",
  "Statement": [{
    "Effect": "Allow",
    "Principal": {
      "Federated": "arn:aws:iam::<account-id>:oidc-provider/token.actions.githubusercontent.com"
    },
    "Action": "sts:AssumeRoleWithWebIdentity",
    "Condition": {
      "StringEquals": {
        "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
        "token.actions.githubusercontent.com:sub": "repo:BASHBOP/bashbop-event-web:environment:production"
      }
    }
  }]
}`,"plain"],[".github/workflows/deploy.yml, production job",`  production:
    runs-on: ubuntu-latest

      - run: aws sts get-caller-identity  # prints the role you assumed`]],
  steps:[["Trust says who, policy says what","The trust policy decides which workflow may assume the role; a separate permissions policy decides what it can do. Keep both narrow."],["`sub` is the lock","`repo:BASHBOP/bashbop-event-web:environment:production` means only jobs in that environment can assume it, not a PR branch, not another repo."],["Credentials expire on their own","The action swaps GitHub’s token for temporary AWS credentials that last an hour by default. Nothing to rotate, nothing long-lived to leak."],["Prove it in the log","`aws sts get-caller-identity` prints the assumed role’s ARN, so a wrong role is visible immediately."]]};

DEEP.p11={verify:"Checked: the YAML parses and the verify command passes `bash -n`. Adapt: replace every `<commit-sha>` with the full SHA of that action’s release, create a key pair with `cosign generate-key-pair`, store the private key and its password as secrets, and commit `cosign.pub`.",title:"A hardened build job with provenance",
  intro:"Deny-by-default permissions, SHA-pinned actions, BuildKit provenance and a cosign signature you verify before every deploy. All of it works on GitHub Team.",

jobs:

      - uses: docker/setup-buildx-action@<commit-sha> # v3.x.x, needed for SBOM and provenance
      - uses: docker/login-action@<commit-sha>        # v3.x.x
        with:

        with:

DEEP.p12={verify:"Checked: the script passes `bash -n`. The fault scripts it calls are yours to write, each with `inject` and `undo`.",title:"The postmortem template and a safe fault injector",
  intro:"A postmortem that produces action items, and a script that injects one random fault into staging while logging it where you won’t look until the end.",
  files:[["docs/postmortems/YYYY-MM-DD-bookings-stuck-pending.md",`# Postmortem: bookings stuck pending (game day, staging)

Status: final   Severity: SEV2 (exercise)   Commander: <name>

## Summary
Two sentences: what customers experienced, for how long, and why.

## Impact
- Duration: 14:03–14:38 UTC (35 min)
- Affected: 12 test bookings left pending
- Detected by: alert webhook_4xx_rate, 22 min after the fault

## Timeline (UTC)
- 14:03 fault injected (facilitator log)
- 14:25 alert fired; incident declared
- 14:35 mitigated: correct webhook secret restored
- 14:38 failed events resent; bookings confirmed

## What went well / what didn't

## Root cause and trigger
The trigger, then the conditions that let it reach customers.

## Action items
| Action                                         | Type    | Owner | Due    |
|------------------------------------------------|---------|-------|--------|
| Alert when webhook 4xx rate > 5% for 10 min    | detect  | you   | 30 Sep |
| Synthetic test booking after every deploy      | prevent | you   | 7 Oct  |`,"plain"],["scripts/gameday/inject.sh",`#!/usr/bin/env bash
# Game-day fault injector: STAGING ONLY. Every fault script has inject and undo.
set -euo pipefail

[[ "\${TARGET_ENV:-}" == "staging" ]] || { echo "refusing: TARGET_ENV must be staging" >&2; exit 1; }

faults=(webhook-secret feed-missing-file worker-secret)
pick=\${faults[RANDOM % \${#faults[@]}]}

# the responder doesn't read this file until the review
echo "$(date -u +%FT%TZ) inject $pick" >> "$HOME/gameday-facilitator.log"

"./faults/$pick.sh" inject`]],
  steps:[["Numbers, not adjectives","Durations, counts and the detection delay come from timestamps, so the review argues about facts."],["Separate trigger from cause","The wrong secret was the trigger; the cause is that nothing alerted on failing webhooks for 22 minutes."],["Every action item is owned and dated","An item without an owner and a date is a wish. Link each one to a tracked issue."],["Make faults refuse production","The injector checks `TARGET_ENV` before doing anything, and every fault script ships with its own `undo`."]]};

DEEP.p14={verify:"Checked: both Ansible files parse as YAML. The Jenkinsfile isn’t machine-checked here, use Jenkins’ declarative linter (`jenkins-cli declarative-linter`), and the test stage needs `jest-junit` installed.",
  title:"An idempotent Nginx role and a declarative Jenkinsfile",
  intro:"The Nginx part of that practice host as an Ansible role that only reloads on real changes, and the {job:p2} PR gate rewritten as a Jenkinsfile.",
  files:[["roles/nginx/tasks/main.yml",`- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure the API site
  ansible.builtin.template:
    src: api.conf.j2
    dest: /etc/nginx/sites-enabled/api.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Validate the full Nginx config before any handler runs
  ansible.builtin.command: nginx -t
  changed_when: false`],["roles/nginx/handlers/main.yml",`- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded`],["Jenkinsfile",`pipeline {
  agent { label 'linux' }
  options {
    timeout(time: 30, unit: 'MINUTES')
    disableConcurrentBuilds(abortPrevious: true)
  }
  stages {
    stage('Install') {
      steps { sh 'corepack enable && yarn install --immutable' }
    }
    stage('Checks') {
      parallel {
        stage('Lint')  { steps { sh 'yarn lint' } }
        stage('Types') { steps { sh 'yarn tsc:check' } }
        stage('Test')  { steps { sh 'yarn test --ci --reporters=default --reporters=jest-junit' } }
      }
    }
    stage('Build') {
      when { branch 'main' }
      steps {
        withCredentials([string(credentialsId: 'example-api-token', variable: 'API_TOKEN')]) {
          sh 'yarn build'
        }
      }
    }
  }
  post {
    always { junit allowEmptyResults: true, testResults: 'junit.xml' }
  }
}`,"plain"]],
  steps:[["Modules over commands","`apt` and `template` report changed only when they act, so the handler fires only on real changes."],["Validate before reloading","If `nginx -t` fails, the play stops before handlers run, so a broken config never reaches a live reload. Fix forward quickly, the bad file is on disk."],["Parallel stages share a workspace","Lint, types and tests run side by side like jobs in Actions, but on one agent, so they share `node_modules` instead of reinstalling."],["Credentials stay scoped","`withCredentials` exposes the secret only inside its block and masks the exact value in the log."]]};

  files:[["cka-objective-map.md (excerpt)",`| Domain (weight)              | Objective                          | Where I did it               | Confidence |

| Storage (10%)                | StorageClasses, PVs and PVCs       | not covered                  | 1/5        |`,"plain"],["~/.bashrc in the exam terminal",`alias k=kubectl

export do="--dry-run=client -o yaml"            # k create deploy web --image=nginx $do > web.yaml

k create deployment web --image=nginx --replicas=2 $do > web.yaml
k expose deployment web --port=80 --target-port=80 $do > web-svc.yaml

Situation  Game day on staging: bookings stayed pending after successful Stripe payments.
Task       I was incident commander and operator: restore confirmations, and find out why
           monitoring missed it.
Action     Declared the incident on the first alert and posted updates every 15 minutes.
           Checked Stripe's webhook deliveries first (all 400s), traced them to a wrong

  steps:[["Lead with the result","Hiring managers skim. Put the measured change in the first line and the tools in brackets."],["Only numbers you measured","Every figure should come from your own before/after data, interviewers ask how you measured it."],["End with what changed","The second game day’s faster detection is the part that proves you learn from incidents."],["Two minutes, then stop","A tight story invites follow-up questions, the ones you’ve already prepared for."]]};

/* ------------------------------------------------------------------ helpers */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function md(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\{job:(p\d+)\}/g,function(m,id){return "job "+(pidx(id)+1);});}
function hl(src){return src.split("\n").map(function(line){var e=esc(line);var m=e.match(/^(\s*)(#|\/\/)(.*)$/);if(m)return m[1]+"<span class=\"c\">"+m[2]+m[3]+"</span>";var i=e.search(/\s(#|\/\/)\s/);return i>=0?e.slice(0,i)+"<span class=\"c\">"+e.slice(i)+"</span>":e;}).join("\n");}
function $(sel,el){return (el||document).querySelector(sel);}
function tid(p,k,i){return p.id+"-"+k+i;}

/* ------------------------------------------------------------------ state */
var LS="bdt-progress-v1", SS="bdt-slide";
var embedded;
try{embedded=JSON.parse(document.getElementById("progress-data").textContent);}catch(e){embedded={};}
embedded=normalise(embedded);
var local=null;
try{local=normalise(JSON.parse(localStorage.getItem(LS)||"null"));}catch(e){local=null;}
var state=embedded, dirty=false;
if(local && local.updatedAt>embedded.updatedAt){state=local;dirty=true;}
function normalise(s){s=s&&typeof s==="object"?s:{};return {v:1,updatedAt:+s.updatedAt||0,started:typeof s.started==="string"?s.started:"",done:s.done&&typeof s.done==="object"?s.done:{},notes:s.notes&&typeof s.notes==="object"?s.notes:{}};}

function phaseStats(p){
  var ids=[];p.tasks.forEach(function(_,i){ids.push(tid(p,"t",i));});p.exit.forEach(function(_,i){ids.push(tid(p,"x",i));});if(DRILL[p.id])(DRILL[p.id].checks||DRILL_CHECKS).forEach(function(_,i){ids.push(tid(p,"d",i));});
  var n=ids.filter(function(id){return state.done[id];}).length;
  return {n:n,total:ids.length,status:n===0?"queued":(n===ids.length?"passed":"running")};
}
function totals(){var n=0,t=0,passed=0;PHASES.forEach(function(p){var s=phaseStats(p);n+=s.n;t+=s.total;if(s.status==="passed")passed++;});return {n:n,t:t,passed:passed};}
function targetDate(p){
  if(!state.started)return "";
  var d=new Date(state.started+"T00:00:00");if(isNaN(d))return "";
  d.setDate(d.getDate()+p.weeks[1]*7-1);
  return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
}
function isLate(p){
  if(!state.started||phaseStats(p).status==="passed")return false;
  var d=new Date(state.started+"T00:00:00");d.setDate(d.getDate()+p.weeks[1]*7);
  return Date.now()>d.getTime();
}

/* ------------------------------------------------------------------ saving */
var artifactNs=null, canPublish=false, saveTimer=null, chipState="local";
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function change(){
  state.updatedAt=Date.now();dirty=true;persistLocal();
  setChip(canPublish?"unsaved":"local");
  scheduleSave(15000);
}
function scheduleSave(ms){
  clearTimeout(saveTimer);
  if(!canPublish)return;
  saveTimer=setTimeout(function(){
    var a=document.activeElement;
    if(a&&a.tagName==="TEXTAREA"){scheduleSave(8000);return;}
    publishNow();
  },ms);
}
function buildDoc(){
  var css=document.getElementById("app-css").textContent;
  var js=document.getElementById("app-js").textContent;
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  var S="scr"+"ipt";
  return "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">"+
    "<title>Bashbop DevOps Track</title>"+
    "<link id=\"fonts\" rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap\">"+
    "<style id=\"app-css\">"+css+"</style></head><body><div id=\"root\"></div>"+
    "<"+S+" type=\"application/json\" id=\"progress-data\">"+json+"</"+S+">"+
    "<"+S+" id=\"app-js\">"+js+"</"+S+"></body></html>";
}
function publishNow(){
  clearTimeout(saveTimer);
  if(!artifactNs||!canPublish||!dirty)return;
  try{sessionStorage.setItem(SS,String(cur));}catch(e){}
  setChip("saving");
  artifactNs.publish(buildDoc()).then(function(){dirty=false;setChip("saved");})
  .catch(function(e){
    var c=e&&e.code;
    if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"){canPublish=false;setChip("local");}
    else if(c==="conflict"){setChip("conflict");}
    else if(c==="rate_limited"){setChip("unsaved");scheduleSave(60000);}
    else{setChip("error");}
  });
}
var CHIP={saved:"Progress saved to page",unsaved:"Unsaved changes",saving:"Saving…",local:"Saved in this browser",conflict:"Newer version loading",error:"Couldn’t save, try again"};
function setChip(s){
  chipState=s;var el=$("#chip");if(!el)return;
  el.setAttribute("data-s",s);
  var btn=(s==="unsaved"||s==="error")&&canPublish?"<button type=\"button\" id=\"savenow\">Save now</button>":"";
  el.innerHTML="<b></b><span>"+CHIP[s]+"</span>"+btn;
  var b=$("#savenow");if(b)b.onclick=publishNow;
  var hs=$("#howsave");if(hs)hs.textContent=CHIP[s];
}

/* ------------------------------------------------------------------ slides */
var HEAD=5, PER=7;
function ps(pi){return HEAD+pi*PER;}
function pidx(id){for(var k=0;k<PHASES.length;k++){if(PHASES[k].id===id)return k;}return 0;}
var SLIDES=[{type:"cover",label:"Run overview"},{type:"howto",label:"How this track works"},{type:"audit",label:"Baseline: both products today"},{type:"arch",which:"bashbop",label:"bashbop architecture"},{type:"arch",which:"bbb",label:"Brain Boost Buddy architecture"}];
PHASES.forEach(function(p,pi){
  SLIDES.push({type:"intro",pi:pi,label:"Why "+p.short.toLowerCase()});
  SLIDES.push({type:"how",pi:pi,label:"How it works"});
  SLIDES.push({type:"flow",pi:pi,label:p.flowTitle});
  SLIDES.push({type:"deep",pi:pi,label:"Worked example"});
  SLIDES.push({type:"lab",pi:pi,label:"Lab tasks"});
  SLIDES.push({type:"drill",pi:pi,label:"Break-fix drill"});
  SLIDES.push({type:"check",pi:pi,label:"Checkpoint"});
});
SLIDES.push({type:"habits",label:"Weekly rhythm"});

function eyebrowFor(p,pi,extra){
  var s=phaseStats(p);
  return "<div class=\"eyebrow\" data-a style=\"--i:0\"><span>job "+(pi+1)+"/"+PHASES.length+" · "+esc(p.short)+" · weeks "+p.weeks[0]+"–"+p.weeks[1]+"</span>"+
    "<span class=\"pill "+s.status+" st\">"+s.status+"</span>"+(isLate(p)?"<span class=\"pill risk st\">behind target</span>":"")+(extra||"")+"</div>";
}

function startedLabel(){return state.started?"started "+new Date(state.started+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"not started";}
function runRows(){
  var h="";
  PHASES.forEach(function(p,pi){
    var s=phaseStats(p), td=targetDate(p);
    if(p.part==="job"&&!(pi&&PHASES[pi-1].part==="job"))h+="<div class=\"runsep\">Job-ready track · if your goal is a DevOps role</div>";
    h+="<button class=\"runrow\" type=\"button\" data-go=\""+ps(pi)+"\"><span class=\"dot "+s.status+"\"></span><span><span class=\"nm\">"+esc(p.title)+"</span><div class=\"meta\">weeks "+p.weeks[0]+"–"+p.weeks[1]+(td?" · due "+esc(td):"")+(isLate(p)?" · behind":"")+"</div><div class=\"bar\"><span style=\"width:"+(s.total?s.n/s.total*100:0)+"%\"></span></div></span><span class=\"right\">"+s.n+"/"+s.total+"</span></button>";
  });
  return h;
}

function renderSlide(i){
  var sl=SLIDES[i], h="";
  if(sl.type==="cover"){
    var t=totals(), pct=t.t?Math.round(t.n/t.t*100):0;
    h+="<div class=\"eyebrow\" data-a style=\"--i:0\"><span>pipeline · bashbop + Brain Boost Buddy</span><span id=\"started\">"+esc(startedLabel())+"</span></div>";
    h+="<h1 data-a style=\"--i:1\">Bashbop DevOps Track</h1>";
    h+="<p class=\"lede\" data-a style=\"--i:2\">Eleven jobs and a capstone across bashbop and Brain Boost Buddy, from reading your own server to signed releases, cloud networks, supply-chain security, on-call and a full game day, then four job-ready jobs: production Kubernetes, Ansible and Jenkins, a certification, and interviews. Every lab is real work on your repos.</p>";
    h+="<div class=\"two\">";
    h+="<div class=\"run\" id=\"run\" data-a style=\"--i:3\">"+runRows()+"</div>";
    h+="<div style=\"display:flex;flex-direction:column;gap:22px\">";
    h+="<div class=\"stats\" data-a style=\"--i:4\"><div class=\"stat\"><div class=\"n\">"+pct+"%</div><div class=\"l\">complete</div></div><div class=\"stat\"><div class=\"n\">"+t.n+"<span class=\"muted\" style=\"font-size:22px\">/"+t.t+"</span></div><div class=\"l\">checks ticked</div></div><div class=\"stat\"><div class=\"n\">"+t.passed+"<span class=\"muted\" style=\"font-size:22px\">/"+PHASES.length+"</span></div><div class=\"l\">jobs passed</div></div></div>";
    h+="<div class=\"panel\" data-a style=\"--i:5\"><div class=\"row\" style=\"justify-content:space-between\"><div class=\"field\"><label for=\"start\">Start date</label><input type=\"date\" id=\"start\" value=\""+esc(state.started)+"\"></div><button class=\"btn primary\" type=\"button\" id=\"resume\">"+(t.n?"Resume":"Start job 1")+" →</button></div><p class=\"small muted\" style=\"margin-top:12px\">Set a start date to get a due date per job. At a few hours a week, the core run is about nine months, and the job-ready track adds about four more.</p>"+
      "<div class=\"row\" style=\"margin-top:14px;gap:8px\"><button class=\"btn\" type=\"button\" id=\"export\">Export progress</button><button class=\"btn\" type=\"button\" id=\"import\">Import</button><input type=\"file\" id=\"importfile\" accept=\"application/json,.json\" hidden></div><p class=\"small muted\" style=\"margin-top:8px\">Browsers can clear saved site data, so keep an export as a backup or to move to another device.</p></div>";
    h+="</div></div>";
  }
  else if(sl.type==="howto"){
    h+="<div class=\"eyebrow\" data-a style=\"--i:0\"><span>how this track works</span></div>";
    h+="<h2 data-a style=\"--i:1\">Learn how it works, apply it, break it, prove it.</h2>";
    h+="<div class=\"loop\" data-a style=\"--i:2\"><div><span class=\"k\">1 · learn</span><h3>How it works</h3><p class=\"small muted\">Concepts plus a diagram of the mechanism underneath, not just its name.</p></div><div><span class=\"k\">2 · study</span><h3>Worked example</h3><p class=\"small muted\">Annotated config for your stack, with what was checked and what to adapt.</p></div><div><span class=\"k\">3 · apply</span><h3>Lab tasks</h3><p class=\"small muted\">Real changes to bashbop and Brain Boost Buddy.</p></div><div><span class=\"k\">4 · break</span><h3>Break-fix drill</h3><p class=\"small muted\">Break staging on purpose, diagnose from symptoms with hints, then reveal the answer.</p></div><div><span class=\"k\">5 · prove</span><h3>Checkpoint</h3><p class=\"small muted\">Exit criteria, five scenario questions and notes. A job passes when every box is ticked.</p></div></div>";
    h+="<div class=\"two\">";
    h+="<div class=\"panel\" data-a style=\"--i:3\"><h3 style=\"margin-bottom:12px\">Moving around</h3><div class=\"keys\"><span><kbd>→</kbd></span><span>Next slide</span><span><kbd>←</kbd></span><span>Previous slide</span><span><kbd>space</kbd></span><span>Scroll down, then next slide</span><span><kbd>O</kbd></span><span>All slides overview</span><span><kbd>Home</kbd> <kbd>End</kbd></span><span>First / last slide</span><span>Top rail</span><span>Jump to any job; green is passed, amber is in progress</span></div></div>";
    h+="<div class=\"panel\" data-a style=\"--i:4\"><h3 style=\"margin-bottom:12px\">How progress is kept</h3><p class=\"small muted\">"+(window.claude?"Ticks, notes and your start date save into this page as a new version about 15 seconds after you stop, so they follow you to any device. If this view can’t save to the page, they stay in this browser.":"Ticks, notes and your start date save in this browser as you go. Browsers can clear saved site data (Safari does after about a week without a visit), so use Export progress on the first slide now and then, and Import to restore it or carry on in another browser.")+"</p><p class=\"small\" style=\"margin-top:12px\">Right now: <strong id=\"howsave\">"+CHIP[chipState]+"</strong></p></div>";
    h+="</div>";
  }
  else if(sl.type==="audit"){
    h+="<div class=\"eyebrow\" data-a style=\"--i:0\"><span>baseline · read from the repos on 13 Sep 2026</span></div>";
    h+="<h2 data-a style=\"--i:1\">Where both products start</h2>";
    h+="<p class=\"lede\" data-a style=\"--i:2\">These findings are the first lab tasks, you learn each concept by fixing something real.</p>";
    h+="<div class=\"findings\" data-a style=\"--i:3\">";
    FINDINGS.forEach(function(f){var k=pidx(f[3]);h+="<div class=\"finding\"><span class=\"pill "+f[0]+"\">"+(f[0]==="risk"?"risk":f[0]==="warn"?"gap":"tidy")+"</span><span><strong>"+esc(f[1])+"</strong>, "+md(f[2])+"</span><button class=\"fix\" type=\"button\" data-go=\""+(ps(k)+4)+"\">job "+(k+1)+" →</button></div>";});
    h+="</div>";
    h+="<div data-a style=\"--i:4\"><h3 style=\"margin-bottom:10px\">Already in good shape</h3><div class=\"strengths\">"+STRENGTHS.map(function(s){return "<span>"+esc(s)+"</span>";}).join("")+"</div></div>";
  }
  else if(sl.type==="arch"){
    var A=ARCH[sl.which];
    h+="<div class=\"eyebrow\" data-a style=\"--i:0\"><span>architecture · "+esc(A.product)+" · as read on 13 Sep 2026</span></div>";
    h+="<h2 data-a style=\"--i:1\">"+esc(A.title)+"</h2>";
    h+="<figure class=\"arch\" data-a style=\"--i:2\"><div class=\"svgwrap\">"+A.svg()+"</div><figcaption>"+md(A.caption)+"</figcaption></figure>";
    h+="<div data-a style=\"--i:3\"><h3 style=\"margin-bottom:10px\">Where the jobs change this picture</h3><div class=\"jobchips\">"+A.jobs.map(function(j){var k=pidx(j[0]);return "<button type=\"button\" data-go=\""+ps(k)+"\"><b>job "+(k+1)+"</b>"+esc(j[1])+"</button>";}).join("")+"</div></div>";
  }
  else if(sl.type==="habits"){
    var tt=totals();
    h+="<div class=\"eyebrow\" data-a style=\"--i:0\"><span>after the run · "+tt.n+"/"+tt.t+" checks</span></div>";
    h+="<h2 data-a style=\"--i:1\">A weekly rhythm that makes it stick</h2>";
    h+="<div class=\"loop\" data-a style=\"--i:2\"><div><span class=\"k\">mon · 1h</span><h3>Read</h3><p class=\"small muted\">One concept from the current job, plus its docs. Write three lines in the job’s notes.</p></div><div><span class=\"k\">wed · 2h</span><h3>Build</h3><p class=\"small muted\">One lab task as a real PR with full checks green.</p></div><div><span class=\"k\">sat · 1h</span><h3>Break</h3><p class=\"small muted\">Break something on staging on purpose and recover it. Tick the task only once it’s proven.</p></div></div>";
    h+="<div class=\"two\">";
    h+="<div class=\"panel\" data-a style=\"--i:3\"><h3 style=\"margin-bottom:12px\">Rules for the whole run</h3><ul class=\"res\" style=\"gap:10px\"><li>Anything you do twice, automate.</li><li>Every piece of infrastructure gets a README or runbook entry.</li><li>Main being red is information to raise, never something to filter out.</li><li>Practise on staging; production is for things you’ve already rehearsed.</li></ul></div>";
    h+="<div class=\"panel\" data-a style=\"--i:4\"><h3 style=\"margin-bottom:12px\">Where to go next</h3><ul class=\"res\"><li>roadmap.sh/devops, a checklist to find gaps</li><li>KodeKloud labs, timed practice for certifications</li><li>Google SRE Book & Workbook, free at sre.google</li><li>Gene Kim et al., The Phoenix Project</li></ul></div>";
    h+="</div>";
  }
  else{
    var p=PHASES[sl.pi], pi=sl.pi, s=phaseStats(p);
    if(sl.type==="intro"){
      var td=targetDate(p);
      h+=eyebrowFor(p,pi,td?"<span>due "+esc(td)+"</span>":"");
      h+="<h2 data-a style=\"--i:1\">"+esc(p.title)+"</h2>";
      h+="<p class=\"lede\" data-a style=\"--i:2\">"+md(p.why)+"</p>";
      h+="<div data-a style=\"--i:3\"><h3 style=\"margin-bottom:10px\">Concepts to learn</h3><div class=\"terms\">"+p.terms.map(function(t){return "<div class=\"term\"><b>"+md(t[0])+"</b><span>"+md(t[1])+"</span></div>";}).join("")+"</div></div>";
    }
    else if(sl.type==="flow"){
      h+=eyebrowFor(p,pi);
      h+="<h2 data-a style=\"--i:1\">"+esc(p.flowTitle)+"</h2>";
      h+="<div class=\"flow\" data-a style=\"--i:2\">"+p.flow.map(function(n,k){return (k?"<span class=\"link\" aria-hidden=\"true\"></span>":"")+"<div class=\"node"+(k===p.hot?" hot":"")+"\"><span class=\"tag\">"+esc(n[0])+"</span><span class=\"t\">"+md(n[1])+"</span><span class=\"s\">"+md(n[2])+"</span></div>";}).join("")+"</div>";
      h+="<div class=\"callouts\" data-a style=\"--i:3\">"+p.callouts.map(function(c){return "<div class=\"callout "+(c[0]==="info"?"info":"")+"\">"+md(c[1])+"</div>";}).join("")+"</div>";
    }
    else if(sl.type==="how"){
      var HW=HOW[p.id];
      h+=eyebrowFor(p,pi,"<span>how it works</span>");
      h+="<h2 data-a style=\"--i:1\">"+esc(HW.title)+"</h2>";
      h+="<div class=\"how\"><figure class=\"arch\" data-a style=\"--i:2\"><div class=\"svgwrap\">"+HW.svg()+"</div><figcaption>"+md(HW.caption)+"</figcaption></figure><div class=\"explain\" data-a style=\"--i:3\">"+HW.points.map(function(x){return "<div><b>"+md(x[0])+"</b><span>"+md(x[1])+"</span></div>";}).join("")+"</div></div>";
    }
    else if(sl.type==="drill"){
      var DR=DRILL[p.id];
      h+=eyebrowFor(p,pi,"<span>break-fix drill</span>"+(DR.open?"<span class=\"pill risk\">live investigation</span>":""));
      h+="<h2 data-a style=\"--i:1\">Drill: "+esc(DR.title)+"</h2>";
      h+="<div class=\"drill\" data-a style=\"--i:2\"><div class=\"panel\"><h3>Break it</h3><p class=\"small muted\">"+md(DR.setup)+"</p></div><div class=\"panel\"><h3>What you’ll see</h3><ul class=\"symptoms\">"+DR.symptoms.map(function(x){return "<li><span>"+md(x)+"</span></li>";}).join("")+"</ul></div><div class=\"panel\"><h3>Investigate</h3>"+DR.hints.map(function(x,k){return "<details class=\"hint\"><summary>Hint "+(k+1)+" of "+DR.hints.length+"</summary><p>"+md(x)+"</p></details>";}).join("")+"</div></div>";
      h+="<details class=\"reveal\" data-a style=\"--i:3\"><summary>"+(DR.open?"Suspects, fix and prevention":"Cause, fix and prevention")+"</summary><div class=\"reveal-body\"><div><h4>"+(DR.open?"Suspects":"Cause")+"</h4><p>"+md(DR.cause)+"</p></div><div><h4>Fix</h4><p>"+md(DR.fix)+"</p></div><div><h4>Prevent</h4><p>"+md(DR.prevent)+"</p></div></div></details>";
      h+="<ul class=\"tasks\" data-a style=\"--i:4\">"+(DR.checks||DRILL_CHECKS).map(function(t,k){var id=tid(p,"d",k),on=!!state.done[id];return "<li class=\"task"+(on?" done":"")+"\"><label><input type=\"checkbox\" class=\"settled\" data-task=\""+id+"\""+(on?" checked":"")+"><span class=\"tx\"><span class=\"main\">"+md(t)+"</span></span></label></li>";}).join("")+"</ul>";
    }
    else if(sl.type==="deep"){
      var D=DEEP[p.id];
      h+=eyebrowFor(p,pi,"<span>worked example</span>");
      h+="<h2 data-a style=\"--i:1\">"+esc(D.title)+"</h2>";
      h+="<p class=\"lede\" data-a style=\"--i:2\">"+md(D.intro)+"</p>";
      h+="<div class=\"deep\" data-a style=\"--i:3\"><div class=\"codes\">"+D.files.map(function(f){return "<div><div class=\"codehead\">"+esc(f[0])+"</div><pre class=\"code\"><code>"+(f[2]==="plain"?esc(f[1]):hl(f[1]))+"</code></pre></div>";}).join("")+(D.verify?"<p class=\"verify\">"+md(D.verify)+"</p>":"")+"</div><ol class=\"steps\">"+D.steps.map(function(x){return "<li><span><b>"+esc(x[0])+"</b>"+md(x[1])+"</span></li>";}).join("")+"</ol></div>";
    }
    else if(sl.type==="lab"){
      var ln=p.tasks.filter(function(_,k){return state.done[tid(p,"t",k)];}).length;
      h+=eyebrowFor(p,pi);
      h+="<div class=\"labhead\" data-a style=\"--i:1\"><h2>Lab: "+esc(p.short.toLowerCase())+" on bashbop</h2><div class=\"count\" id=\"labcount\">"+ln+"<small>/ "+p.tasks.length+" tasks</small></div></div>";
      h+="<ul class=\"tasks\" data-a style=\"--i:2\">"+p.tasks.map(function(t,k){var id=tid(p,"t",k),on=!!state.done[id];return "<li class=\"task"+(on?" done":"")+"\"><label><input type=\"checkbox\" class=\"settled\" data-task=\""+id+"\""+(on?" checked":"")+"><span class=\"tx\"><span class=\"main\">"+md(t[0])+"</span>"+(t[1]?"<span class=\"why\">"+md(t[1])+"</span>":"")+"</span></label></li>";}).join("")+"</ul>";
    }
    else if(sl.type==="check"){
      h+=eyebrowFor(p,pi);
      h+="<h2 data-a style=\"--i:1\">Checkpoint: is job "+(pi+1)+" green?</h2>";
      h+="<div class=\"two\">";
      h+="<div style=\"display:flex;flex-direction:column;gap:22px\">";
      h+="<div data-a style=\"--i:2\"><h3 style=\"margin-bottom:10px\">Exit criteria</h3><ul class=\"tasks\">"+p.exit.map(function(t,k){var id=tid(p,"x",k),on=!!state.done[id];return "<li class=\"task"+(on?" done":"")+"\"><label><input type=\"checkbox\" class=\"settled\" data-task=\""+id+"\""+(on?" checked":"")+"><span class=\"tx\"><span class=\"main\">"+md(t)+"</span></span></label></li>";}).join("")+"</ul></div>";
      h+="<div class=\"panel\" data-a style=\"--i:3\"><h3 style=\"margin-bottom:12px\">Self-check</h3>"+p.quiz.map(function(q){return "<details class=\"q\"><summary><span>"+md(q[0])+"</span></summary><p>"+md(q[1])+"</p></details>";}).join("")+"</div>";
      h+="</div>";
      h+="<div style=\"display:flex;flex-direction:column;gap:22px\">";
      h+="<div data-a style=\"--i:4\"><div class=\"field\"><label for=\"notes-"+p.id+"\">Notes for job "+(pi+1)+"</label><textarea id=\"notes-"+p.id+"\" data-notes=\""+p.id+"\" placeholder=\"What surprised you, commands worth keeping, links to PRs…\">"+esc(state.notes[p.id]||"")+"</textarea></div></div>";
      h+="<div class=\"panel\" data-a style=\"--i:5\"><h3 style=\"margin-bottom:12px\">Resources</h3><ul class=\"res\">"+p.res.map(function(r){return "<li><span>"+md(r)+"</span></li>";}).join("")+"</ul></div>";
      h+="</div></div>";
    }
  }
  return "<div class=\"inner\">"+h+"</div>";
}

/* ------------------------------------------------------------------ shell */
var cur=0;
function initialSlide(){
  var n=NaN;
  try{var ss=sessionStorage.getItem(SS);if(ss!==null){n=parseInt(ss,10);sessionStorage.removeItem(SS);}}catch(e){}
  if(isNaN(n)){var m=location.hash.match(/^#s-(\d+)$/);if(m)n=parseInt(m[1],10)-1;}
  return isNaN(n)?0:Math.max(0,Math.min(SLIDES.length-1,n));
}

document.getElementById("root").innerHTML=
  "<div class=\"app\">"+
   "<header class=\"top\"><div class=\"brand\"><i></i>DevOps Track</div><nav class=\"rail\" id=\"rail\" aria-label=\"Jobs\"></nav><div class=\"chip\" id=\"chip\" role=\"status\"></div></header>"+
   "<main class=\"stage\" id=\"stage\"></main>"+
   "<footer class=\"bottom\"><div class=\"nav\"><button type=\"button\" id=\"prev\" aria-label=\"Previous slide\">←</button><button type=\"button\" id=\"next\" aria-label=\"Next slide\">→</button></div><div class=\"where\"><span class=\"lbl\" id=\"lbl\"></span><div class=\"track\"><span id=\"track\"></span></div></div><button class=\"ovbtn\" type=\"button\" id=\"ovbtn\">All slides <kbd>O</kbd></button></footer>"+
  "</div><div class=\"overview\" id=\"overview\" hidden></div>";

function renderRail(){
  var r="";
  PHASES.forEach(function(p,pi){
    var s=phaseStats(p), here=SLIDES[cur].pi===pi;
    if(pi)r+="<span class=\"wire"+(phaseStats(PHASES[pi-1]).status==="passed"?" lit":"")+"\"></span>";
    r+="<button type=\"button\" class=\"job"+(here?" here":"")+"\" data-go=\""+ps(pi)+"\" title=\""+esc(p.title)+", "+s.n+"/"+s.total+"\"><span class=\"dot "+s.status+"\"></span><span class=\"jl\">"+esc(p.short)+"</span></button>";
  });
  $("#rail").innerHTML=r;
}
function renderChrome(){
  var sl=SLIDES[cur];
  var ctx=sl.pi!=null?"Job "+(sl.pi+1)+" · "+PHASES[sl.pi].short+", "+sl.label:sl.label;
  $("#lbl").textContent=(cur+1)+" / "+SLIDES.length+"  ·  "+ctx;
  $("#track").style.width=((cur+1)/SLIDES.length*100)+"%";
  $("#prev").disabled=cur===0;$("#next").disabled=cur===SLIDES.length-1;
  renderRail();
}
function show(i,dir,animate){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  var stage=$("#stage");
  var el=document.createElement("section");
  el.className="slide"+(animate?" animate "+(dir<0?"in-prev":"in-next"):"");
  el.setAttribute("aria-label",SLIDES[i].label);
  cur=i;
  el.innerHTML=renderSlide(i);
  stage.innerHTML="";stage.appendChild(el);
  try{history.replaceState(null,"","#s-"+(i+1));}catch(e){}
  renderChrome();
}
function go(i){if(i===cur)return;show(i,i>cur?1:-1,true);closeOverview();}

function openOverview(){
  var o=$("#overview"),h="<div class=\"ovgrid\"><div class=\"row\" style=\"justify-content:space-between\"><h2>All slides</h2><button class=\"btn\" type=\"button\" id=\"ovclose\">Close <kbd>Esc</kbd></button></div>";
  var groups=[{name:"Start",idx:[0,1,2,3,4]}];
  PHASES.forEach(function(p,pi){var b=ps(pi);groups.push({name:"Job "+(pi+1)+" · "+p.title,pi:pi,idx:[b,b+1,b+2,b+3,b+4,b+5,b+6]});});
  groups.push({name:"Finish",idx:[SLIDES.length-1]});
  groups.forEach(function(g){
    h+="<div class=\"ovgroup\"><h3>"+(g.pi!=null?"<span class=\"dot "+phaseStats(PHASES[g.pi]).status+"\"></span>":"")+esc(g.name)+"</h3><div class=\"ovcards\">"+g.idx.map(function(k){return "<button type=\"button\" class=\"ovcard"+(k===cur?" cur":"")+"\" data-go=\""+k+"\"><span>"+(k+1)+"</span>"+esc(SLIDES[k].label)+"</button>";}).join("")+"</div></div>";
  });
  o.innerHTML=h+"</div>";o.hidden=false;
  var c=o.querySelector(".ovcard.cur");if(c)c.focus();
}
function closeOverview(){var o=$("#overview");if(!o.hidden){o.hidden=true;o.innerHTML="";}}

/* ------------------------------------------------------------------ events */
document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");
  if(g){go(parseInt(g.getAttribute("data-go"),10));return;}
  if(e.target.closest("#prev"))go(cur-1);
  else if(e.target.closest("#next"))go(cur+1);
  else if(e.target.closest("#ovbtn"))openOverview();
  else if(e.target.closest("#ovclose"))closeOverview();
  else if(e.target.closest("#resume")){
    var target=PHASES.findIndex(function(p){return phaseStats(p).status!=="passed";});
    if(target<0)target=PHASES.length-1;
    go(ps(target)+(phaseStats(PHASES[target]).n?4:0));
  }
  else if(e.target.closest("#export"))exportProgress();
  else if(e.target.closest("#import"))$("#importfile").click();
});
function exportProgress(){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));
  a.download="devops-track-progress-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function importProgress(file){
  var r=new FileReader();
  r.onload=function(){
    var s;try{s=JSON.parse(r.result);}catch(e){s=null;}
    if(!s||typeof s!=="object"||!s.done||typeof s.done!=="object"){alert("That file isn’t a DevOps Track progress export.");return;}
    s=normalise(s);
    if(!confirm("Replace the progress in this browser with this file ("+Object.keys(s.done).length+" checks ticked)?"))return;
    state=s;change();show(cur,0,false);
  };
  r.readAsText(file);
}
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.matches("input[data-task]")){
    t.classList.remove("settled");
    var id=t.getAttribute("data-task");
    if(t.checked)state.done[id]=true;else delete state.done[id];
    var li=t.closest(".task");if(li)li.classList.toggle("done",t.checked);
    var sl=SLIDES[cur];
    if(sl.type==="lab"){var p=PHASES[sl.pi];var n=p.tasks.filter(function(_,k){return state.done[tid(p,"t",k)];}).length;var lc=$("#labcount");if(lc)lc.innerHTML=n+"<small>/ "+p.tasks.length+" tasks</small>";}
    var eb=document.querySelector(".slide .eyebrow .st");
    if(eb&&sl.pi!=null){var st=phaseStats(PHASES[sl.pi]).status;eb.className="pill "+st+" st";eb.textContent=st;}
    renderRail();change();
  } else if(t.id==="start"){
    // Chrome fires change on every keystroke once the date is valid (year 0002, 0020…);
    // wait for a real year, and update the rows in place so the field keeps focus
    var v=t.value||"";
    if(v&&!(+v.slice(0,4)>=2000))return;
    state.started=v;change();
    var run=$("#run"),st=$("#started");
    if(run)run.innerHTML=runRows();if(st)st.textContent=startedLabel();
  } else if(t.id==="importfile"&&t.files&&t.files[0]){
    importProgress(t.files[0]);t.value="";
  }
});
var noteTimer;
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.matches("textarea[data-notes]")){
    state.notes[t.getAttribute("data-notes")]=t.value;
    clearTimeout(noteTimer);noteTimer=setTimeout(change,600);
  }
});
document.addEventListener("focusout",function(e){
  if(e.target.matches&&e.target.matches("textarea[data-notes]")&&dirty&&canPublish)scheduleSave(4000);
});
document.addEventListener("keydown",function(e){
  var tag=(e.target.tagName||"");
  if(tag==="TEXTAREA"||tag==="INPUT"){return;}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var ov=!$("#overview").hidden;
  if(e.key==="Escape"&&ov){closeOverview();return;}
  if(e.key==="o"||e.key==="O"){ov?closeOverview():openOverview();e.preventDefault();return;}
  if(ov)return;
  var space=e.key===" "&&tag!=="BUTTON"&&tag!=="SUMMARY";
  if(e.key==="ArrowRight"){go(cur+1);e.preventDefault();}
  else if(e.key==="ArrowLeft"){go(cur-1);e.preventDefault();}
  else if(e.key==="PageDown"||(space&&!e.shiftKey)){if(!page(1))go(cur+1);e.preventDefault();}
  else if(e.key==="PageUp"||(space&&e.shiftKey)){if(!page(-1))go(cur-1);e.preventDefault();}
  else if(e.key==="Home"){go(0);e.preventDefault();}
  else if(e.key==="End"){go(SLIDES.length-1);e.preventDefault();}
});
// scroll the current slide by a screen; false when already at that end
function page(d){
  var s=$("#stage .slide");if(!s)return false;
  var room=d>0?s.scrollHeight-s.clientHeight-s.scrollTop:s.scrollTop;
  if(room<4)return false;
  s.scrollBy({top:d*Math.max(80,s.clientHeight-80),behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
  return true;
}
// a swipe that starts on something that scrolls sideways (code, diagrams, the rail) is a scroll, not a slide change
function inHScroller(el){
  for(;el&&el!==document.body;el=el.parentElement){
    if(el.scrollWidth>el.clientWidth+1&&/auto|scroll/.test(getComputedStyle(el).overflowX))return true;
  }
  return false;
}
var tx=null;
document.addEventListener("touchstart",function(e){tx=e.touches.length===1&&$("#overview").hidden&&!inHScroller(e.target)?[e.touches[0].clientX,e.touches[0].clientY]:null;},{passive:true});
document.addEventListener("touchend",function(e){
  if(!tx)return;var dx=e.changedTouches[0].clientX-tx[0],dy=e.changedTouches[0].clientY-tx[1];tx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1));
},{passive:true});
window.addEventListener("beforeunload",function(){persistLocal();});
window.addEventListener("hashchange",function(){var m=location.hash.match(/^#s-(\d+)$/);if(m)go(Math.max(0,Math.min(SLIDES.length-1,parseInt(m[1],10)-1)));});

/* ------------------------------------------------------------------ boot */
show(initialSlide(),0,false);
setChip("local");
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("artifact").then(function(ns){
    if(!ns){setChip("local");return;}
    artifactNs=ns;canPublish=true;
    setChip(dirty?"unsaved":"saved");
  }).catch(function(){setChip("local");});
}
})();
</script>
</body>
